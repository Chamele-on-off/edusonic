<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSonic AI - Личный кабинет ученика</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        :root {
            --primary: #7E76F9;
            --secondary: #6A61E5;
            --dark: #4A5568;
            --light: #F8FAFC;
            --accent: #FF7B9C;
            --text: #2D3748;
            --text-light: #718096;
            --success: #48BB78;
            --warning: #ED8936;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
            --progress-bg: #e2e8f0;
            --progress-fill: var(--success);
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        
        .auth-container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gradient);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        
        .logo p {
            color: var(--text-light);
            font-size: 1.1rem;
        }
        
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e1e1e1;
            padding-bottom: 1rem;
        }
        
        .tab-btn {
            padding: 0.8rem 1.5rem;
            background: none;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .tab-btn:hover {
            color: var(--primary);
            background: rgba(126, 118, 249, 0.1);
        }
        
        .tab-btn.active {
            color: var(--primary);
            background: rgba(126, 118, 249, 0.1);
            border-bottom: 3px solid var(--primary);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .student-info {
            background: linear-gradient(135deg, rgba(126, 118, 249, 0.1), rgba(106, 97, 229, 0.05));
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(126, 118, 249, 0.2);
        }
        
        .student-info h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .student-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .detail-label {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 500;
        }
        
        .detail-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }
        
        .edit-info-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.3s ease;
        }
        
        .edit-info-btn:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
        
        /* Карточки предметов/режимов */
        .subject-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        
        .subject-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .subject-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .subject-icon {
            font-size: 2rem;
            color: var(--primary);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(126, 118, 249, 0.1);
            border-radius: 10px;
        }
        
        .subject-title {
            flex: 1;
        }
        
        .subject-title h4 {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 0.2rem;
        }
        
        .subject-title p {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        
        .btn {
            padding: 0.8rem 1.5rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
            text-decoration: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(126, 118, 249, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }
        
        .btn-small {
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
        }
        
        /* Список уроков */
        .lessons-container {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 1rem;
            border: 1px solid #e1e1e1;
            border-radius: 10px;
            padding: 1rem;
        }
        
        .lesson-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #f1f1f1;
            transition: background 0.3s ease;
        }
        
        .lesson-item:hover {
            background: rgba(126, 118, 249, 0.05);
        }
        
        .lesson-item:last-child {
            border-bottom: none;
        }
        
        .lesson-status {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
        }
        
        .lesson-status.completed {
            background: rgba(72, 187, 120, 0.1);
            color: var(--success);
        }
        
        .lesson-status.current {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }
        
        .lesson-status.pending {
            background: rgba(203, 213, 225, 0.1);
            color: #94a3b8;
        }
        
        .lesson-info {
            flex: 1;
        }
        
        .lesson-info h5 {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 0.2rem;
        }
        
        .lesson-info p {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        
        .lesson-number {
            font-weight: 600;
            color: var(--primary);
            margin-right: 0.5rem;
        }
        
        /* Управление аватаром */
        .avatar-controls {
            background: rgba(248, 250, 252, 0.8);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border: 1px solid rgba(126, 118, 249, 0.2);
        }
        
        .avatar-controls h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .avatar-select-container {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .avatar-select {
            flex: 1;
            min-width: 250px;
            padding: 1rem;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: border 0.3s ease;
        }
        
        .avatar-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(126, 118, 249, 0.1);
        }
        
        .avatar-preview {
            width: 100px;
            height: 100px;
            border: 3px solid #e1e1e1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            overflow: hidden;
        }
        
        .avatar-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .avatar-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            display: none;
        }
        
        .avatar-status.success {
            background: rgba(72, 187, 120, 0.1);
            border: 1px solid rgba(72, 187, 120, 0.2);
            color: #166534;
        }
        
        .avatar-status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #dc2626;
        }
        
        /* Кнопка выхода */
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 2rem;
        }
        
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: translateY(-2px);
        }
        
        /* Информационные сообщения */
        .info-message {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #1e40af;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #dc2626;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        /* Загрузка */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }
        
        .loading i {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }
        
        /* Специальные стили для взрослых/студентов */
        .adult-mode-card {
            background: linear-gradient(135deg, rgba(126, 118, 249, 0.05), rgba(106, 97, 229, 0.03));
            border: 2px dashed var(--primary);
        }
        
        .free-conversation-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 100%;
        }
        
        .cefr-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        
        /* Прогресс-бар (оставим для уроков) */
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .progress-text {
            font-size: 0.9rem;
            color: var(--text);
        }
        
        .progress-percent {
            font-weight: 600;
            color: var(--primary);
        }
        
        .subject-actions {
            display: flex;
            gap: 0.8rem;
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .auth-container {
                padding: 2rem 1.5rem;
                margin: 10px;
            }
            
            .logo h1 {
                font-size: 1.7rem;
            }
            
            .tabs {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .tab-btn {
                width: 100%;
                justify-content: center;
            }
            
            .avatar-select-container {
                flex-direction: column;
                align-items: stretch;
            }
            
            .avatar-select {
                min-width: 100%;
            }
            
            .avatar-preview {
                align-self: center;
            }
            
            .subject-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            
            .auth-container {
                padding: 1.5rem 1rem;
            }
            
            .logo h1 {
                font-size: 1.5rem;
            }
            
            .logo p {
                font-size: 1rem;
            }
            
            .subject-header {
                flex-direction: column;
                text-align: center;
            }
        }
        
        /* Стили для скроллбара */
        .lessons-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .lessons-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        .lessons-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        
        .lessons-container::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }
        
        /* Стиль для ссылок на уроки */
        .lesson-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .lesson-link:hover {
            background: rgba(126, 118, 249, 0.1);
            text-decoration: underline;
        }
        
        /* Стили для вкладки уроков взрослых */
        .lessons-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e1e1e1;
        }
        
        .lessons-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .cefr-level-selector {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        
        .cefr-level-btn {
            padding: 0.5rem 1rem;
            background: white;
            border: 1px solid #e1e1e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .cefr-level-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .cefr-level-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Заголовок -->
        <div class="logo">
            <h1>Личный кабинет ученика</h1>
            <p>Управляйте своим обучением и прогрессом</p>
        </div>
        
        <!-- Информация об ученике -->
        <div class="student-info">
            <h3><i class="fas fa-user-graduate"></i> Ваш профиль</h3>
            <div class="student-details" id="studentDetails">
                <!-- Данные будут заполнены через JavaScript -->
            </div>
            <button class="edit-info-btn" onclick="redirectToProfile()">
                <i class="fas fa-edit"></i> Изменить данные профиля
            </button>
        </div>
        
        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('lessons')">
                <i class="fas fa-book"></i> Все уроки
            </button>
            <button class="tab-btn" onclick="switchTab('avatar')">
                <i class="fas fa-user-circle"></i> Аватар
            </button>
        </div>
        
        <!-- Вкладка 1: Все уроки -->
        <div id="lessonsTab" class="tab-content active">
            <div class="info-message" id="lessonsMessage">
                <i class="fas fa-info-circle"></i>
                <span id="lessonsMessageText">Выберите режим обучения</span>
            </div>
            
            <div id="lessonsContent">
                <!-- Контент будет загружен через JavaScript -->
            </div>
            
            <div class="loading" id="lessonsLoading">
                <i class="fas fa-spinner"></i>
                <p>Загрузка уроков...</p>
            </div>
        </div>
        
        <!-- Вкладка 2: Управление аватаром -->
        <div id="avatarTab" class="tab-content">
            <div class="info-message" id="avatarMessage">
                <i class="fas fa-info-circle"></i>
                <span>Выберите аватар для AI-учителя во всех ваших комнатах</span>
            </div>
            
            <div class="avatar-controls">
                <h3><i class="fas fa-user-circle"></i> Выбор аватара учителя</h3>
                <div class="avatar-select-container">
                    <select id="avatarSelect" class="avatar-select">
                        <option value="">Выберите аватар...</option>
                    </select>
                    <div class="avatar-preview" id="avatarPreview">
                        <i class="fas fa-user" style="font-size: 3rem; color: #6c757d;"></i>
                    </div>
                </div>
                <button class="btn" onclick="setAvatarForAllRooms()" style="margin-top: 1rem;">
                    <i class="fas fa-check"></i> Установить аватар для всех комнат
                </button>
                <div id="avatarStatus" class="avatar-status"></div>
            </div>
        </div>
        
        <!-- Кнопка выхода -->
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Выйти из системы
        </button>
    </div>

    <script>
        // Socket.io connection
        const socket = io();
        
        // Глобальные переменные
        let currentStudentData = null;
        let availableAvatars = [];
        let currentLessonsData = null;
        let currentCEFRLevel = 'A1';
        
        // Иконки для предметов
        const subjectIcons = {
            'математика': 'fas fa-calculator',
            'алгебра': 'fas fa-square-root-alt',
            'геометрия': 'fas fa-shapes',
            'физика': 'fas fa-atom',
            'химия': 'fas fa-flask',
            'биология': 'fas fa-dna',
            'история': 'fas fa-landmark',
            'обществознание': 'fas fa-globe',
            'литература': 'fas fa-book',
            'русский язык': 'fas fa-language',
            'английский язык': 'fas fa-flag-usa',
            'французский язык': 'fas fa-flag',
            'география': 'fas fa-map',
            'информатика': 'fas fa-laptop-code',
            'default': 'fas fa-book-open'
        };
        
        // Описания уровней CEFR
        const cefrDescriptions = {
            'A1': 'Начинающий - базовые фразы и выражения',
            'A2': 'Элементарный - простые повседневные ситуации',
            'B1': 'Средний - ясное общение на знакомые темы',
            'B2': 'Выше среднего - сложные тексты и дискуссии',
            'C1': 'Продвинутый - свободное общение, академические тексты',
            'C2': 'В совершенстве - владение на уровне носителя'
        };
        
        // ==============================
        // ОСНОВНЫЕ ФУНКЦИИ
        // ==============================
        
        // Функция выхода из системы
        function logout() {
            fetch('/logout', {
                method: 'POST'
            }).then(() => {
                window.location.href = '/login';
            }).catch(() => {
                window.location.href = '/login';
            });
        }
        
        // Переключение вкладок
        function switchTab(tabName) {
            // Скрыть все вкладки
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Убрать активный класс у всех кнопок
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Показать выбранную вкладку
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            // Сделать активной кнопку
            event.target.classList.add('active');
            
            // Загрузить данные для вкладки

        }
        
        // Проверка авторизации при загрузке
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                
                if (data.success && data.role === 'student') {
                    await loadStudentDataFromServer();
                } else {
                    window.location.href = '/login';

            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/login';

        // Загрузка данных ученика с сервера
        async function loadStudentDataFromServer() {
            try {
                const response = await fetch('/api/student/profile');
                const data = await response.json();
                
                if (data.success && data.student_data) {
                    currentStudentData = data.student_data;
                    currentStudentData.user_id = data.user_id;
                    
                    // Обновить отображение данных ученика
                    updateStudentInfoDisplay();

                    // Загрузить аватары

                </div>

        // Получение текстового представления класса/уровня
        function getLevelText(level) {
            const levels = {
                '1': '1 класс',
                '2': '2 класс', 
                '3': '3 класс',
                '4': '4 класс',
                '5': '5 класс',
                '6': '6 класс',
                '7': '7 класс',
                '8': '8 класс',
                '9': '9 класс',
                '10': '10 класс',
                '11': '11 класс',
                'student': 'Студент',

            };
            return levels[level] || level;
        }
        
        // ==============================
        // ВКЛАДКА ВСЕХ УРОКОВ
        // ==============================
        
        // Загрузка данных для вкладки уроков
        async function loadLessonsData() {
            try {
                showLoading('lessons');
                
                const container = document.getElementById('lessonsContent');
                const messageText = document.getElementById('lessonsMessageText');
                
                // Проверяем, является ли студент взрослым
                if (currentStudentData?.is_adult) {
                    if (currentStudentData.study_mode === 'anything') {
                        // Режим "изучать что угодно"
                        messageText.textContent = 'Режим "изучать что угодно" - используйте свободную конференцию для общения на любые темы';
                        container.innerHTML = renderFreeConversationMode();
                    } else if (currentStudentData.study_mode === 'language') {
                        // Режим английского языка
                        const languageLevel = currentStudentData.language_level || 'A1';
                        messageText.textContent = `Вы изучаете английский язык (уровень ${languageLevel})`;
                        await loadAdultEnglishLessons(languageLevel);
                    }
                } else {
                    // Школьник - старая логика
                    messageText.textContent = 'Выберите предмет для просмотра всех доступных уроков';
                    await loadSchoolStudentLessons();
                }
                
                hideLoading('lessons');
            } catch (error) {
                console.error('Error loading lessons:', error);
                document.getElementById('lessonsMessage').className = 'error-message';
                document.getElementById('lessonsMessage').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Ошибка загрузки уроков';
                hideLoading('lessons');
            }
        }

                currentCEFRLevel = cefrLevel;

                                </div>
                                <div class="subject-title">

                                    <button class="btn" onclick="startAdultLanguageRoom('${cefrLevel}')" style="flex: 1;">
                                        <i class="fas fa-plus-circle"></i> Создать комнату для английского языка
                                    </button>
                                    <button class="btn btn-secondary" onclick="startFreeConversation()" style="flex: 1;">
                                        <i class="fas fa-comment-alt"></i> Свободная конференция
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading adult English lessons:', error);
                const container = document.getElementById('lessonsContent');
                container.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        Ошибка загрузки уроков английского языка
                    </div>
                `;
            }

        // Отображение уроков английского для взрослых
        function renderAdultEnglishLessons(lessons, cefrLevel) {
            // Сортируем уроки по номеру
            const sortedLessons = [...lessons].sort((a, b) => {
                const aNum = extractLessonNumber(a.title) || 999;
                const bNum = extractLessonNumber(b.title) || 999;
                return aNum - bNum;
            });
            
            return `
                <div class="subject-card adult-mode-card">
                    <div class="subject-header">
                        <div class="subject-icon">
                            <i class="fas fa-flag-usa"></i>
                        </div>
                        <div class="subject-title">
                            <h4>Английский язык <span class="cefr-badge">${cefrLevel}</span></h4>
                            <p>${cefrDescriptions[cefrLevel] || 'Уроки английского языка'}</p>
                        </div>
                    </div>
                    
                    <div style="margin: 1.5rem 0;">
                        <div class="lessons-container">
                            <div style="margin-bottom: 1rem; font-size: 1.1rem; font-weight: 600; color: var(--primary); display: flex; align-items: center; justify-content: space-between;">
                                <span>
                                    <i class="fas fa-book"></i> Доступные уроки
                                </span>
                                <span style="font-size: 0.9rem; color: var(--text-light);">
                                    ${lessons.length} уроков
                                </span>
                            </div>
                            
                            ${sortedLessons.map((lesson, index) => {
                                const lessonNum = extractLessonNumber(lesson.title) || index + 1;
                                return `
                                    <div class="lesson-item">
                                        <div class="lesson-status pending">
                                            <i class="fas fa-clock"></i>
                                        </div>
                                        <div class="lesson-info">
                                            <h5>
                                                <span class="lesson-number">Урок ${lessonNum}:</span>
                                                ${lesson.title.replace(/^Урок \d+:\s*/, '')}
                                            </h5>
                                            <p>
                                                Английский язык • Уровень ${cefrLevel}
                                            </p>
                                        </div>
                                        <div>
                                            <button class="btn btn-small lesson-link" onclick="startAdultSpecificLesson('${lesson.id}', '${cefrLevel}')">
                                                <i class="fas fa-play"></i> Начать
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        
                        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                            <button class="btn" onclick="startAdultLanguageRoom('${cefrLevel}')" style="flex: 1;">
                                <i class="fas fa-plus-circle"></i> Создать комнату для английского языка
                            </button>
                            <button class="btn btn-secondary" onclick="startFreeConversation()" style="flex: 1;">
                                <i class="fas fa-comment-alt"></i> Свободная конференция
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Извлечение номера урока из названия
        function extractLessonNumber(title) {
            const match = title.match(/Урок\s*(\d+)/i) || title.match(/(\d+)/);
            return match ? parseInt(match[1]) : null;
        }
        
        // Загрузка уроков для школьников
        async function loadSchoolStudentLessons() {
            try {
                const response = await fetch('/api/student/lessons-by-class');
                const data = await response.json();
                
                const container = document.getElementById('lessonsContent');
                
                if (data.success && data.lessons && Object.keys(data.lessons).length > 0) {
                    container.innerHTML = renderSchoolSubjects(data.lessons);
                } else {
                    container.innerHTML = `
                        <div class="info-message">
                            <i class="fas fa-info-circle"></i>
                            <span>Уроки для вашего класса пока не загружены</span>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading school lessons:', error);
                const container = document.getElementById('lessonsContent');
                container.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        Ошибка загрузки уроков
                    </div>
                `;
            }
        }
        
        // Отображение предметов для школьников
        function renderSchoolSubjects(subjects) {
            let html = '<div style="display: flex; flex-direction: column; gap: 1.5rem;">';
            
            for (const [subjectName, subjectData] of Object.entries(subjects)) {
                const lessons = subjectData.lessons || [];
                const totalLessons = lessons.length;
                const completedLessons = lessons.filter(l => l.completed).length;
                const progressPercent = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;
                
                html += `
                    <div class="subject-card">
                        <div class="subject-header">
                            <div class="subject-icon">
                                <i class="${subjectIcons[subjectName] || subjectIcons.default}"></i>
                            </div>
                            <div class="subject-title">
                                <h4>${subjectName.charAt(0).toUpperCase() + subjectName.slice(1)}</h4>
                                <p>${totalLessons} уроков • ${completedLessons} завершено</p>
                            </div>
                        </div>
                        
                        ${totalLessons > 0 ? `
                            <div class="progress-info">
                                <span class="progress-text">Прогресс</span>
                                <span class="progress-percent">${progressPercent}%</span>
                            </div>
                            
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progressPercent}%"></div>
                            </div>
                        ` : ''}
                        
                        <div class="subject-actions">
                            ${totalLessons > 0 ? `
                                <button class="btn btn-small" onclick="startSchoolSubjectLesson('${subjectName}')">
                                    <i class="fas fa-play"></i> Начать урок
                                </button>
                                <button class="btn btn-small btn-secondary" onclick="viewSchoolSubjectLessons('${subjectName}')">
                                    <i class="fas fa-list"></i> Все уроки
                                </button>
                            ` : `
                                <button class="btn btn-small" onclick="startSchoolSubjectLesson('${subjectName}')">
                                    <i class="fas fa-plus-circle"></i> Создать комнату
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }
            
            html += '</div>';
            return html;
        }
        
        // ==============================
        // ФУНКЦИИ ДЛЯ ЗАПУСКА КОНФЕРЕНЦИЙ
        // ==============================
        
        // Начать свободную конференцию (для взрослых/студентов)
        async function startFreeConversation() {
            try {
                console.log('🚀 Начинаем свободную конференцию');
                
                let apiEndpoint, requestBody;
                
                if (currentStudentData?.is_adult) {
                    // Для взрослых/студентов
                    apiEndpoint = '/api/adult/free-room';
                    requestBody = {};
                } else {
                    // Для школьников
                    apiEndpoint = '/api/student/create-conference';
                    requestBody = { subject: 'общее' };
                }
                
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                if (data.success && data.room_id) {
                    console.log(`✅ Свободная конференция создана: ${data.room_id}`);
                    openConference(data.room_id, 'общее', null, true, 'anything');
                } else {
                    throw new Error(data.error || 'Ошибка создания свободной конференции');
                }
            } catch (error) {
                console.error('❌ Ошибка создания свободной конференции:', error);
                
                // Fallback: создаем комнату вручную
                const timestamp = Date.now();
                const studentName = currentStudentData?.name?.replace(/\s+/g, '_').toLowerCase() || 'student';
                const roomName = `free_conversation_${studentName}_${timestamp}`;
                
                alert(`Создана свободная конференция: ${roomName}`);
                openConference(roomName, 'общее', null, true);
            }
        }
        
        // Создать комнату для английского языка (взрослые)
        async function startAdultLanguageRoom(cefrLevel) {
            try {
                console.log(`🚀 Создаем комнату для английского языка уровня ${cefrLevel}`);
                
                const response = await fetch('/api/student/create-adult-room', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        study_mode: 'language',
                        language_level: cefrLevel
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.room_id) {
                    console.log(`✅ Комната создана: ${data.room_id}`);
                    openConference(data.room_id, 'английский язык', null, true, 'language', cefrLevel);
                } else {
                    throw new Error(data.error || 'Ошибка создания комнаты');
                }
            } catch (error) {
                console.error('❌ Ошибка создания комнаты для английского:', error);
                alert(`Ошибка: ${error.message}`);
            }
        }
        
        // Начать конкретный урок английского (взрослые)
        async function startAdultSpecificLesson(lessonId, cefrLevel) {
            try {
                console.log(`🚀 Начинаем урок английского ${lessonId} уровня ${cefrLevel}`);
                
                // 1. Создаем комнату
                const roomResponse = await fetch('/api/student/create-adult-room', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        study_mode: 'language',
                        language_level: cefrLevel
                    })
                });
                
                const roomData = await roomResponse.json();
                
                if (!roomData.success || !roomData.room_id) {
                    throw new Error(roomData.error || 'Ошибка создания комнаты');
                }
                
                const roomName = roomData.room_id;
                console.log(`✅ Комната создана: ${roomName}`);
                
                // 2. Регистрируем комнату с уроком
                try {
                    await fetch('/api/room/register-student', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            room_id: roomName,
                            student_data: currentStudentData,
                            lesson_id: lessonId,
                            subject: 'английский язык',
                            is_adult: true,
                            study_mode: 'language',
                            language_level: cefrLevel
                        })
                    });
                } catch (regError) {
                    console.warn('⚠️ Предупреждение при регистрации комнаты:', regError);
                }
                
                // 3. Открываем конференцию
                openConference(roomName, 'английский язык', lessonId, true, 'language', cefrLevel);
                
            } catch (error) {
                console.error('❌ Ошибка запуска урока английского:', error);
                alert(`Ошибка: ${error.message}`);
            }
        }
        
        // Начать урок по предмету (школьники)
        async function startSchoolSubjectLesson(subjectName) {
            try {
                console.log(`🚀 Начинаем урок по предмету: ${subjectName}`);
                
                // Получаем комнату для предмета
                const response = await fetch(`/api/student/get-room/${encodeURIComponent(subjectName)}`);
                const data = await response.json();
                
                if (data.success && data.room) {
                    const roomName = data.room.room_name;
                    console.log(`✅ Комната получена: ${roomName}`);
                    openConference(roomName, subjectName);
                } else {
                    throw new Error('Комната не найдена');
                }
            } catch (error) {
                console.error('❌ Ошибка запуска урока:', error);
                
                // Fallback: создаем комнату вручную
                const timestamp = Date.now();
                const studentName = currentStudentData?.name?.replace(/\s+/g, '_').toLowerCase() || 'student';
                const roomName = `student_${subjectName}_${studentName}_${timestamp}`;
                
                alert(`Создана комната: ${roomName}`);
                openConference(roomName, subjectName);
            }
        }
        
        // Просмотреть все уроки по предмету (школьники)
        async function viewSchoolSubjectLessons(subjectName) {
            try {
                // Получаем уроки по предмету
                const response = await fetch('/api/student/lessons-by-class');
                const data = await response.json();
                
                if (data.success && data.lessons && data.lessons[subjectName]) {
                    const lessons = data.lessons[subjectName].lessons;
                    const container = document.getElementById('lessonsContent');
                    
                    container.innerHTML = renderSubjectLessonsList(subjectName, lessons);
                }
            } catch (error) {
                console.error('Ошибка загрузки уроков предмета:', error);
                alert('Ошибка загрузки уроков');
            }
        }
        
        // Отображение списка уроков по предмету
        function renderSubjectLessonsList(subjectName, lessons) {
            // Сортируем уроки по номеру
            const sortedLessons = [...lessons].sort((a, b) => {
                return (a.lesson_number || 999) - (b.lesson_number || 999);
            });
            
            return `
                <div class="subject-card">
                    <div class="subject-header">
                        <div class="subject-icon">
                            <i class="${subjectIcons[subjectName] || subjectIcons.default}"></i>
                        </div>
                        <div class="subject-title">
                            <h4>${subjectName.charAt(0).toUpperCase() + subjectName.slice(1)}</h4>
                            <p>${lessons.length} уроков</p>
                        </div>
                    </div>
                    
                    <div style="margin: 1.5rem 0;">
                        <div class="lessons-container">
                            ${sortedLessons.map((lesson, index) => {
                                const isCompleted = lesson.completed || false;
                                return `
                                    <div class="lesson-item">
                                        <div class="lesson-status ${isCompleted ? 'completed' : 'pending'}">
                                            ${isCompleted ? '<i class="fas fa-check"></i>' : '<i class="fas fa-clock"></i>'}
                                        </div>
                                        <div class="lesson-info">
                                            <h5>
                                                <span class="lesson-number">Урок ${lesson.lesson_number || index + 1}:</span>
                                                ${lesson.title}
                                            </h5>
                                            <p>
                                                ${subjectName} • ${lesson.class_level || currentStudentData?.education_level || 'Не указан'} класс
                                                ${isCompleted ? '• <span style="color: var(--success);">Завершен</span>' : ''}
                                            </p>
                                        </div>
                                        <div>
                                            <button class="btn btn-small lesson-link" onclick="startSchoolSpecificLesson('${lesson.id}', '${subjectName}')">
                                                <i class="fas ${isCompleted ? 'fa-redo' : 'fa-play'}"></i>
                                                ${isCompleted ? 'Повторить' : 'Начать'}
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        
                        <div style="margin-top: 1.5rem;">
                            <button class="btn" onclick="startSchoolSubjectLesson('${subjectName}')" style="width: 100%;">
                                <i class="fas fa-plus-circle"></i> Создать комнату для ${subjectName}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Начать конкретный урок (школьники)
        async function startSchoolSpecificLesson(lessonId, subjectName) {
            try {
                // Создаем комнату
                await startSchoolSubjectLesson(subjectName);
                
                // TODO: Реализовать запуск конкретного урока
                // Пока просто открываем комнату, урок будет выбран автоматически при входе
                console.log(`Урок ${lessonId} будет выбран при входе в комнату`);
            } catch (error) {
                console.error('Ошибка запуска урока:', error);
            }
        }
        
        // Открытие конференции
        function openConference(roomName, subjectName, lessonId = null, isAdult = false, studyMode = null, languageLevel = null) {
            console.log(`🌐 Открываем конференцию: ${roomName}, предмет: ${subjectName}, урок: ${lessonId || 'нет'}`);
            
            // Формируем URL с параметрами
            let url = `/conference?room=${encodeURIComponent(roomName)}&student=true&subject=${encodeURIComponent(subjectName)}`;
            
            if (lessonId && lessonId !== 'next') {
                url += `&lesson_id=${encodeURIComponent(lessonId)}`;
            }
            
            // Добавляем информацию о взрослых/студентах
            if (isAdult) {
                url += `&adult=true&study_mode=${studyMode || 'anything'}`;
                if (studyMode === 'language' && languageLevel) {
                    url += `&language_level=${languageLevel}`;
                }
            }
            
            console.log(`🔗 Переход по ссылке: ${url}`);
            
            // Открываем в НОВОЙ вкладке
            window.open(url, '_blank');
        }
        
        // ==============================
        // ВКЛАДКА АВАТАРА
        // ==============================
        
        // Загрузка доступных аватаров
        async function loadAvatars() {
            try {
                const response = await fetch('/api/avatars');
                const data = await response.json();
                
                if (data.avatars && data.avatars.length > 0) {
                    availableAvatars = data.avatars;
                    const avatarSelect = document.getElementById('avatarSelect');
                    avatarSelect.innerHTML = '<option value="">Выберите аватар...</option>';
                    
                    data.avatars.forEach(avatar => {
                        const option = document.createElement('option');
                        option.value = avatar;
                        option.textContent = avatar;
                        avatarSelect.appendChild(option);
                    });
                    
                    // Автоматически выбираем аватар "woman" если он есть
                    const womanAvatar = data.avatars.find(avatar => avatar.toLowerCase().includes('woman'));
                    if (womanAvatar) {
                        avatarSelect.value = womanAvatar;
                        updateAvatarPreview(womanAvatar);
                    }
                    
                    // Слушатель изменения выбора
                    avatarSelect.addEventListener('change', function() {
                        updateAvatarPreview(this.value);
                    });
                }
            } catch (error) {
                console.error('Error loading avatars:', error);
                showAvatarStatus('Ошибка загрузки аватаров', false);
            }
        }
        
        // Обновление превью аватара
        function updateAvatarPreview(avatarName) {
            const preview = document.getElementById('avatarPreview');
            if (avatarName) {
                fetch(`/api/frames/${avatarName}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.frames && data.frames.length > 0) {
                            const firstFrame = data.frames[0];
                            preview.innerHTML = `<img src="/frames/${avatarName}/${firstFrame}" alt="${avatarName}" 
                                onerror="this.style.display='none'; this.parentNode.innerHTML='<i class=\\'fas fa-user\\' style=\\'font-size: 3rem; color: #6c757d;\\'></i>';">`;
                        }
                    })
                    .catch(error => {
                        console.error('Error loading avatar preview:', error);
                        preview.innerHTML = '<i class="fas fa-user" style="font-size: 3rem; color: #6c757d;"></i>';
                    });
            } else {
                preview.innerHTML = '<i class="fas fa-user" style="font-size: 3rem; color: #6c757d;"></i>';
            }
        }
        
        // Установка аватара для всех комнат
        async function setAvatarForAllRooms() {
            const avatarSelect = document.getElementById('avatarSelect');
            const selectedAvatar = avatarSelect.value;
            
            if (!selectedAvatar) {
                showAvatarStatus('Пожалуйста, выберите аватар', false);
                return;
            }
            
            if (!currentStudentData || !currentStudentData.student_id) {
                showAvatarStatus('Сначала войдите в систему', false);
                return;
            }
            
            console.log(`🎯 Setting avatar "${selectedAvatar}" for all student rooms`);
            showAvatarStatus(`Устанавливаем аватар "${selectedAvatar}" для всех комнат...`, true);
            
            try {
                // Проверяем, что аватар существует
                const framesResponse = await fetch(`/api/frames/${selectedAvatar}`);
                const framesData = await framesResponse.json();
                
                if (framesData.error) {
                    throw new Error(framesData.error);
                }
                
                // Получаем все комнаты ученика
                const rooms = await getStudentRooms();
                
                if (!rooms || rooms.length === 0) {
                    showAvatarStatus('Комнаты еще не созданы', false);
                    return;
                }
                
                let successCount = 0;
                
                // Устанавливаем аватар для каждой комнаты
                for (const room of rooms) {
                    try {
                        socket.emit('avatar_changed', {
                            room_id: room.room_name,
                            avatar_name: selectedAvatar
                        });
                        
                        socket.emit('client_start_animation', {
                            room_id: room.room_name,
                            avatar_name: selectedAvatar
                        });
                        
                        console.log(`✅ Avatar set for room: ${room.room_name}`);
                        successCount++;
                        
                        // Небольшая задержка между запросами
                        await new Promise(resolve => setTimeout(resolve, 50));
                        
                    } catch (error) {
                        console.error(`Error setting avatar for room ${room.room_name}:`, error);
                    }
                }
                
                // Сохраняем предпочтение аватара
                try {
                    const response = await fetch('/api/student/set-avatar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            student_id: currentStudentData.student_id,
                            avatar_name: selectedAvatar
                        })
                    });
                    
                    const result = await response.json();
                    if (!result.success) {
                        console.error('Error saving avatar preference:', result.error);
                    }
                } catch (error) {
                    console.error('Error saving avatar preference:', error);
                }
                
                showAvatarStatus(`✅ Аватар "${selectedAvatar}" успешно установлен для ${successCount} комнат!`, true);
                
            } catch (error) {
                console.error('Error setting avatar:', error);
                showAvatarStatus(`❌ Ошибка установки аватара: ${error.message}`, false);
            }
        }
        
        // Показать статус аватара
        function showAvatarStatus(message, isSuccess) {
            const statusDiv = document.getElementById('avatarStatus');
            statusDiv.textContent = message;
            statusDiv.className = `avatar-status ${isSuccess ? 'success' : 'error'}`;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }
        
        // ==============================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ==============================
        
        // Получение комнат ученика
        async function getStudentRooms() {
            if (!currentStudentData || !currentStudentData.student_id) return [];
            
            try {
                const response = await fetch(`/api/student/${currentStudentData.student_id}/rooms`);
                const data = await response.json();
                
                if (data.success && data.rooms) {
                    return data.rooms;
                }
                return [];
            } catch (error) {
                console.error('Error loading rooms:', error);
                return [];
            }
        }
        
        // Показать индикатор загрузки
        function showLoading(tab) {
            const loadingElement = document.getElementById(tab + 'Loading');
            const containerElement = document.getElementById(tab + 'Content');
            
            if (loadingElement) loadingElement.style.display = 'block';
            if (containerElement) containerElement.style.display = 'none';
        }
        
        // Скрыть индикатор загрузки
        function hideLoading(tab) {
            const loadingElement = document.getElementById(tab + 'Loading');
            const containerElement = document.getElementById(tab + 'Content');
            
            if (loadingElement) loadingElement.style.display = 'none';
            if (containerElement) containerElement.style.display = 'block';
        }
        
        // Инициализация Socket.io
        socket.on('connect', function() {
            console.log('✅ Connected to server');
        });
        
        socket.on('avatar_changed', function(data) {
            console.log('✅ Avatar changed in room:', data.room_id, data.avatar_name);
            showAvatarStatus(`Аватар "${data.avatar_name}" установлен в комнате`, true);
        });
        
        // Запуск при загрузке страницы
        window.addEventListener('load', function() {
            checkAuth();
        });
    </script>
</body>
</html>
