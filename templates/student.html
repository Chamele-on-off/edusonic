<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSonic AI - Личный кабинет ученика</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        :root {
            --primary: #7E76F9;
            --secondary: #6A61E5;
            --dark: #4A5568;
            --light: #F8FAFC;
            --accent: #FF7B9C;
            --text: #2D3748;
            --text-light: #718096;
            --success: #48BB78;
            --warning: #ED8936;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        
        .auth-container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gradient);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        
        .logo p {
            color: var(--text-light);
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        input, select {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(126, 118, 249, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(126, 118, 249, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }
        
        .register-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e1e1e1;
        }
        
        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .register-link a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
        
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .subject-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .subject-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .subject-card:active {
            transform: translateY(-1px);
        }
        
        .subject-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            color: var(--primary);
            transition: all 0.3s ease;
        }
        
        .subject-card:hover .subject-icon {
            transform: scale(1.1);
        }
        
        .subject-name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }
        
        .hidden {
            display: none;
        }
        
        .back-button {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }
        
        .back-button:hover {
            color: var(--primary);
        }
        
        .student-info {
            background: linear-gradient(135deg, rgba(126, 118, 249, 0.1), rgba(106, 97, 229, 0.05));
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(126, 118, 249, 0.2);
        }
        
        .student-info h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        
        .student-info p {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        
        .edit-info-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.3s ease;
        }
        
        .edit-info-btn:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
        
        .welcome-message {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(255, 123, 156, 0.1), rgba(255, 142, 158, 0.05));
            border-radius: 12px;
            border: 1px solid rgba(255, 123, 156, 0.2);
        }
        
        .welcome-message h2 {
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }
        
        .welcome-message p {
            color: var(--text-light);
            font-size: 0.95rem;
        }
        
        .subject-description {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 0.5rem;
            line-height: 1.3;
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .auth-container {
                padding: 2rem 1.5rem;
                margin: 10px;
            }
            
            .logo h1 {
                font-size: 1.7rem;
            }
            
            .subjects-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 0.8rem;
            }
            
            .subject-card {
                padding: 1.2rem 0.8rem;
            }
            
            .subject-icon {
                font-size: 2rem;
            }
            
            .subject-name {
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            
            .auth-container {
                padding: 1.5rem 1rem;
            }
            
            .logo h1 {
                font-size: 1.5rem;
            }
            
            .logo p {
                font-size: 1rem;
            }
            
            .subjects-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }
            
            .subject-card {
                padding: 1rem 0.5rem;
            }
            
            .subject-icon {
                font-size: 1.8rem;
                margin-bottom: 0.5rem;
            }
            
            .subject-name {
                font-size: 0.85rem;
            }
            
            .btn {
                padding: 0.9rem;
                font-size: 1rem;
            }
        }
        
        /* Информационные сообщения */
        .info-message {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #1e40af;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #dc2626;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        
        /* Стили для формы редактирования */
        .edit-form {
            background: rgba(248, 250, 252, 0.8);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(126, 118, 249, 0.2);
        }
        
        .edit-form h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .form-actions .btn {
            flex: 1;
        }

        /* Стили для управления аватаром */
        .avatar-controls {
            background: rgba(248, 250, 252, 0.8);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border: 1px solid rgba(126, 118, 249, 0.2);
        }

        .avatar-controls h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .avatar-select-container {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .avatar-select {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            overflow: hidden;
        }

        .avatar-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .avatar-status {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .avatar-status.success {
            background: rgba(72, 187, 120, 0.1);
            border: 1px solid rgba(72, 187, 120, 0.2);
            color: #166534;
        }

        .avatar-status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #dc2626;
        }

        /* Кнопка выхода */
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Выбор предмета (показывается после входа) -->
        <div id="subjectSelection" class="fade-in">
            <button class="back-button" onclick="redirectToProfile()">
                <i class="fas fa-arrow-left"></i> Редактировать профиль
            </button>
            
            <div class="logo">
                <h1>Привет, <span id="studentGreeting"></span>!</h1>
                <p>Выбери предмет для изучения</p>
            </div>
            
            <!-- Информация об ученике -->
            <div class="student-info">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h3><i class="fas fa-user-graduate"></i> Информация об ученике</h3>
                        <p><strong>Имя:</strong> <span id="infoName"></span></p>
                        <p><strong>Класс:</strong> <span id="infoLevel"></span></p>
                        <p><strong>Возраст:</strong> <span id="infoAge"></span> лет</p>
                    </div>
                    <button class="edit-info-btn" onclick="redirectToProfile()">
                        <i class="fas fa-edit"></i> Изменить
                    </button>
                </div>
            </div>
            
            <!-- Управление аватаром -->
            <div class="avatar-controls">
                <h3><i class="fas fa-user-circle"></i> Выбор аватара учителя</h3>
                <div class="avatar-select-container">
                    <select id="avatarSelect" class="avatar-select">
                        <option value="">Выберите аватар...</option>
                    </select>
                    <div class="avatar-preview" id="avatarPreview">
                        <i class="fas fa-user" style="font-size: 2rem; color: #6c757d;"></i>
                    </div>
                    <button class="btn" id="setAvatarBtn" onclick="setAvatarForAllRooms()" style="flex: 0 0 auto;">
                        <i class="fas fa-check"></i> Установить аватар для всех комнат
                    </button>
                </div>
                <div id="avatarStatus" class="avatar-status"></div>
            </div>
            
            <div class="welcome-message">
                <h2><i class="fas fa-rocket"></i> Готовы к обучению?</h2>
                <p>Выберите предмет и начните увлекательное путешествие в мир знаний!</p>
            </div>
            
            <div class="subjects-grid" id="subjectsGrid">
                <!-- Предметы будут загружены через JavaScript -->
            </div>
            
            <button class="btn btn-secondary" onclick="redirectToProfile()" style="margin-top: 1rem;">
                <i class="fas fa-user-edit"></i> Изменить данные профиля
            </button>

            <!-- Кнопка выхода -->
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Выйти из системы
            </button>
        </div>
    </div>

    <script>
        // Socket.io connection
        const socket = io();

        // Данные о предметах
        const subjects = [
            { 
                id: 'math', 
                name: 'Математика', 
                icon: 'fas fa-calculator',
                description: 'Цифры, формулы и логические задачи'
            },
            { 
                id: 'physics', 
                name: 'Физика', 
                icon: 'fas fa-atom',
                description: 'Законы природы и устройство мира'
            },
            { 
                id: 'chemistry', 
                name: 'Химия', 
                icon: 'fas fa-flask',
                description: 'Вещества, реакции и превращения'
            },
            { 
                id: 'biology', 
                name: 'Биология', 
                icon: 'fas fa-dna',
                description: 'Живые организмы и природа'
            },
            { 
                id: 'history', 
                name: 'История', 
                icon: 'fas fa-landmark',
                description: 'События прошлого и великие личности'
            },
            { 
                id: 'social', 
                name: 'Обществознание', 
                icon: 'fas fa-globe',
                description: 'Общество, право и экономика'
            },
            { 
                id: 'literature', 
                name: 'Литература', 
                icon: 'fas fa-book',
                description: 'Книги, поэзия и писатели'
            },
            { 
                id: 'russian', 
                name: 'Русский язык', 
                icon: 'fas fa-language',
                description: 'Грамматика, орфография и речь'
            },
            { 
                id: 'english', 
                name: 'Английский язык', 
                icon: 'fas fa-flag',
                description: 'Иностранный язык и культура'
            },
            { 
                id: 'geography', 
                name: 'География', 
                icon: 'fas fa-map',
                description: 'Страны, природа и путешествия'
            }
        ];

        let currentStudentData = null;
        let studentRooms = [];
        let availableAvatars = [];
        let selectedAvatar = '';

        // Функция выхода из системы
        function logout() {
            fetch('/logout', {
                method: 'POST'
            }).then(() => {
                window.location.href = '/login';
            }).catch(() => {
                window.location.href = '/login';
            });
        }

        // Перенаправление на страницу профиля
        function redirectToProfile() {
            window.location.href = '/student_profile';
        }

        // Проверка авторизации при загрузке
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                
                if (data.success && data.role === 'student') {
                    await loadStudentDataFromServer();
                } else {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/login';
            }
        }

        // Загрузка данных ученика с сервера
        async function loadStudentDataFromServer() {
            try {
                const response = await fetch('/api/student/profile');
                const data = await response.json();
                
                if (data.success && data.student_data) {
                    currentStudentData = data.student_data;
                    currentStudentData.user_id = data.user_id;
                    
                    // Загружаем аватары и информацию о комнатах
                    await loadAvatars();
                    await loadStudentRooms();
                    
                    // Показываем выбор предмета
                    showSubjectSelection(currentStudentData);
                } else {
                    // Если профиль не заполнен, перенаправляем на страницу профиля
                    window.location.href = '/student_profile';
                }
            } catch (error) {
                console.error('Error loading student data:', error);
                window.location.href = '/student_profile';
            }
        }

        // Инициализация Socket.io
        socket.on('connect', function() {
            console.log('✅ Connected to server');
        });

        socket.on('avatar_changed', function(data) {
            console.log('✅ Avatar changed in room:', data.room_id, data.avatar_name);
            showAvatarStatus(`Аватар "${data.avatar_name}" установлен в комнате ${data.room_id}`, true);
        });

        // Загрузка доступных аватаров
        async function loadAvatars() {
            try {
                const response = await fetch('/api/avatars');
                const data = await response.json();
                
                if (data.avatars && data.avatars.length > 0) {
                    availableAvatars = data.avatars;
                    const avatarSelect = document.getElementById('avatarSelect');
                    avatarSelect.innerHTML = '<option value="">Выберите аватар...</option>';
                    
                    data.avatars.forEach(avatar => {
                        const option = document.createElement('option');
                        option.value = avatar;
                        option.textContent = avatar;
                        avatarSelect.appendChild(option);
                    });
                    
                    // Автоматически выбираем аватар "woman" если он есть
                    const womanAvatar = data.avatars.find(avatar => avatar.toLowerCase().includes('woman'));
                    if (womanAvatar) {
                        avatarSelect.value = womanAvatar;
                        selectedAvatar = womanAvatar;
                        updateAvatarPreview(womanAvatar);
                    }
                }
            } catch (error) {
                console.error('Error loading avatars:', error);
            }
        }

        // Обновление превью аватара
        function updateAvatarPreview(avatarName) {
            const preview = document.getElementById('avatarPreview');
            if (avatarName) {
                fetch(`/api/frames/${avatarName}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.frames && data.frames.length > 0) {
                            const firstFrame = data.frames[0];
                            preview.innerHTML = `<img src="/frames/${avatarName}/${firstFrame}" alt="${avatarName}" onerror="this.style.display='none'; this.parentNode.innerHTML='<i class=\\'fas fa-user\\' style=\\'font-size: 2rem; color: #6c757d;\\'></i>';">`;
                        }
                    })
                    .catch(error => {
                        console.error('Error loading avatar preview:', error);
                        preview.innerHTML = '<i class="fas fa-user" style="font-size: 2rem; color: #6c757d;"></i>';
                    });
            } else {
                preview.innerHTML = '<i class="fas fa-user" style="font-size: 2rem; color: #6c757d;"></i>';
            }
        }

        // Установка аватара для всех комнат
        async function setAvatarForAllRooms() {
            const avatarSelect = document.getElementById('avatarSelect');
            const selectedAvatar = avatarSelect.value;
            
            if (!selectedAvatar) {
                showAvatarStatus('Пожалуйста, выберите аватар', false);
                return;
            }
            
            if (!currentStudentData || !currentStudentData.student_id) {
                showAvatarStatus('Сначала войдите в систему', false);
                return;
            }
            
            console.log(`🎯 Setting avatar "${selectedAvatar}" for all student rooms`);
            
            showAvatarStatus(`Устанавливаем аватар "${selectedAvatar}" для всех комнат...`, true);
            
            try {
                const framesResponse = await fetch(`/api/frames/${selectedAvatar}`);
                const framesData = await framesResponse.json();
                
                if (framesData.error) {
                    throw new Error(framesData.error);
                }
                
                const frames = framesData.frames;
                console.log(`Found ${frames.length} frames for avatar ${selectedAvatar}`);
                
                await loadStudentRooms();
                
                if (studentRooms.length === 0) {
                    showAvatarStatus('Комнаты еще не созданы', false);
                    return;
                }
                
                let successCount = 0;
                
                for (const room of studentRooms) {
                    try {
                        socket.emit('avatar_changed', {
                            room_id: room.room_name,
                            avatar_name: selectedAvatar
                        });
                        
                        socket.emit('client_start_animation', {
                            room_id: room.room_name,
                            avatar_name: selectedAvatar
                        });
                        
                        console.log(`✅ Avatar set for room: ${room.room_name}`);
                        successCount++;
                        
                        await new Promise(resolve => setTimeout(resolve, 100));
                        
                    } catch (error) {
                        console.error(`Error setting avatar for room ${room.room_name}:`, error);
                    }
                }
                
                try {
                    const response = await fetch('/api/student/set-avatar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            student_id: currentStudentData.student_id,
                            avatar_name: selectedAvatar
                        })
                    });
                    
                    const result = await response.json();
                    if (!result.success) {
                        console.error('Error saving avatar preference:', result.error);
                    }
                } catch (error) {
                    console.error('Error saving avatar preference:', error);
                }
                
                showAvatarStatus(`✅ Аватар "${selectedAvatar}" успешно установлен для всех ${successCount} комнат!`, true);
                
            } catch (error) {
                console.error('Error loading avatar frames:', error);
                showAvatarStatus(`❌ Ошибка загрузки аватара: ${error.message}`, false);
            }
        }

        function showAvatarStatus(message, isSuccess) {
            const statusDiv = document.getElementById('avatarStatus');
            statusDiv.textContent = message;
            statusDiv.className = `avatar-status ${isSuccess ? 'success' : 'error'}`;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }
        
        // Создание комнат для всех предметов
        async function createStudentRooms() {
            if (!currentStudentData || !currentStudentData.student_id) return;
            
            try {
                const response = await fetch('/api/student/create-rooms', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        student_id: currentStudentData.student_id,
                        student_name: currentStudentData.name,
                        conference_id: currentStudentData.conference_id || Date.now().toString()
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    console.log(`✅ Создано ${result.created_rooms} комнат для ученика`);
                    if (result.rooms) {
                        studentRooms = result.rooms;
                    }
                } else {
                    console.error('Ошибка создания комнат:', result.error);
                }
            } catch (error) {
                console.error('Error creating rooms:', error);
            }
        }
        
        // Загрузка информации о комнатах ученика
        async function loadStudentRooms() {
            if (!currentStudentData || !currentStudentData.student_id) return;
            
            try {
                const response = await fetch(`/api/student/${currentStudentData.student_id}/rooms`);
                const data = await response.json();
                
                if (data.success && data.rooms) {
                    studentRooms = data.rooms;
                }
            } catch (error) {
                console.error('Error loading rooms:', error);
            }
        }
        
        // Получение названия предмета по ID
        function getSubjectName(subjectId) {
            const subject = subjects.find(s => s.id === subjectId);
            return subject ? subject.name : subjectId;
        }
        
        function showSubjectSelection(studentData) {
            // Заполняем информацию об ученике
            updateStudentInfoDisplay(studentData);
            loadAvailableSubjects();
        }
        
        function updateStudentInfoDisplay(studentData) {
            document.getElementById('studentGreeting').textContent = studentData.name;
            document.getElementById('infoName').textContent = studentData.name;
            document.getElementById('infoLevel').textContent = getLevelText(studentData.education_level || studentData.level);
            document.getElementById('infoAge').textContent = studentData.age;
        }
        
        function getLevelText(level) {
            const levels = {
                '1': '1 класс',
                '2': '2 класс', 
                '3': '3 класс',
                '4': '4 класс',
                '5': '5 класс',
                '6': '6 класс',
                '7': '7 класс',
                '8': '8 класс',
                '9': '9 класс',
                '10': '10 класс',
                '11': '11 класс',
                'student': 'Студент',
                'adult': 'Взрослый'
            };
            return levels[level] || level;
        }
        
        function loadAvailableSubjects() {
            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = '';
            
            subjects.forEach(subject => {
                const subjectCard = document.createElement('a');
                subjectCard.className = 'subject-card';
                subjectCard.href = getConferenceUrl(subject.id);
                subjectCard.target = '_blank';
                subjectCard.innerHTML = `
                    <div class="subject-icon">
                        <i class="${subject.icon}"></i>
                    </div>
                    <div class="subject-name">${subject.name}</div>
                    <div class="subject-description">${subject.description}</div>
                `;
                
                grid.appendChild(subjectCard);
            });
        }
        
        // Минималистичная функция для получения URL конференции
        function getConferenceUrl(subjectId) {
            if (!currentStudentData) return '#';
            
            const conferenceId = currentStudentData.conference_id || Date.now().toString();
            const studentName = currentStudentData.name.replace(/\s+/g, '_').toLowerCase();
            const roomName = `${subjectId}_${studentName}_${conferenceId}`;
            
            return `/conference?room=${encodeURIComponent(roomName)}&student=true&subject=${encodeURIComponent(subjectId)}`;
        }
        
        // Проверяем, есть ли сохраненные данные ученика при загрузке страницы
        window.addEventListener('load', function() {
            // Сначала проверяем авторизацию через сессию
            checkAuth();
            
            // Обработчик изменения выбора аватара
            document.getElementById('avatarSelect').addEventListener('change', function() {
                selectedAvatar = this.value;
                updateAvatarPreview(this.value);
            });
        });
    </script>
</body>
</html>
