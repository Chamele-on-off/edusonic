<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальный класс</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --danger: #f72585;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        #header {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        #logo {
            font-weight: bold;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        
        #video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .animated-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
        }
        
        #lesson-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 5;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        #lesson-content h2 {
            margin-bottom: 20px;
            color: var(--success);
            text-align: center;
        }
        
        #lesson-text {
            font-size: 1.4rem;
            line-height: 1.6;
            text-align: center;
        }
        
        #teacher-video-container {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 3px solid white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
            background: black;
        }
        
        #teacher-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #self-video-container {
            position: absolute;
            bottom: 100px;
            left: 20px;
            width: 200px;
            height: 150px;
            border: 3px solid white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
            background: black;
        }
        
        #self-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #status-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        #participants {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #controls {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 20px;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .control-btn.active {
            background: var(--primary);
        }
        
        .control-btn span {
            font-size: 12px;
            margin-top: 4px;
        }
        
        #end-call-btn {
            background: var(--danger);
        }
        
        #end-call-btn:hover {
            background: #e01b74;
        }
        
        #speech-text {
            position: absolute;
            bottom: 270px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 25px;
            max-width: 80%;
            text-align: center;
            display: none;
            font-size: 18px;
            color: white;
            z-index: 10;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        #audio-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        #audio-play-btn {
            padding: 20px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #audio-play-btn:hover {
            background: var(--secondary);
            transform: scale(1.05);
        }
        
        #activate-ai-btn {
            position: absolute;
            bottom: 270px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: none;
        }
        
        #activate-ai-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        @media (max-width: 768px) {
            #header {
                padding: 10px 15px;
            }
            
            #logo {
                font-size: 1.1rem;
            }
            
            #teacher-video-container,
            #self-video-container {
                width: 120px;
                height: 90px;
                bottom: 80px;
            }
            
            #controls {
                padding: 10px;
                gap: 10px;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 16px;
            }
            
            .control-btn span {
                font-size: 10px;
            }
            
            #speech-text {
                bottom: 200px;
                font-size: 16px;
                padding: 12px 20px;
            }
            
            #activate-ai-btn {
                bottom: 200px;
                padding: 12px 24px;
                font-size: 16px;
            }
            
            #lesson-text {
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 480px) {
            #teacher-video-container,
            #self-video-container {
                width: 100px;
                height: 75px;
                bottom: 70px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 14px;
            }
            
            #status-container {
                font-size: 12px;
                padding: 8px 12px;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        body.embedded {
            height: auto;
        }
        
        body.embedded #header {
            display: none;
        }
        
        body.embedded #controls {
            padding: 10px;
        }
        
        body.embedded .control-btn {
            width: 50px;
            height: 50px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="header" class="fade-in">
        <div id="logo">
            <i class="fas fa-chalkboard-teacher"></i>
            <span>Виртуальный класс</span>
        </div>
        <div id="meeting-id">Комната: <span id="room-name">default</span></div>
    </div>

    <div id="main">
        <div id="video-container">
            <div id="background-animation"></div>
            
            <div id="lesson-content">
                <h2 id="lesson-title"></h2>
                <div id="lesson-text"></div>
            </div>
            
            <div id="teacher-video-container" class="fade-in">
                <img id="teacher-video" src="" alt="Аватар учителя">
            </div>
            
            <div id="self-video-container" class="fade-in">
                <video id="self-video" autoplay muted></video>
            </div>
            
            <div id="status-container" class="fade-in">
                <div id="status">Подключение к конференции...</div>
                <div id="participants">
                    <i class="fas fa-users"></i>
                    <span id="participants-count">1</span> участников
                </div>
            </div>
            
            <div id="speech-text"></div>
            <button id="activate-ai-btn" class="fade-in">Activate AI-Teacher</button>
            
            <div id="audio-overlay">
                <button id="audio-play-btn">
                    <i class="fas fa-volume-up"></i> Нажмите для воспроизведения
                </button>
            </div>
        </div>
    </div>

    <div id="controls" class="fade-in">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <i class="fas fa-microphone"></i>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <i class="fas fa-video"></i>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="screen-btn" title="Демонстрация экрана" disabled>
            <i class="fas fa-desktop"></i>
            <span>Экран</span>
        </button>
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <i class="fas fa-expand"></i>
            <span>Полный</span>
        </button>
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <i class="fas fa-phone-slash"></i>
            <span>Выйти</span>
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const isEmbedded = window.location.search.includes('embed=true');
        document.getElementById('room-name').textContent = roomId;
        
        const teacherVideo = document.getElementById('teacher-video');
        const selfVideo = document.getElementById('self-video');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const screenBtn = document.getElementById('screen-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const participantsCount = document.getElementById('participants-count');
        const speechTextDiv = document.getElementById('speech-text');
        const audioOverlay = document.getElementById('audio-overlay');
        const audioPlayBtn = document.getElementById('audio-play-btn');
        const activateAiBtn = document.getElementById('activate-ai-btn');
        const lessonContent = document.getElementById('lesson-content');
        const lessonTitle = document.getElementById('lesson-title');
        const lessonText = document.getElementById('lesson-text');
        const backgroundAnimation = document.getElementById('background-animation');

        let userStream = null;
        let socket = null;
        let isMicOn = false;
        let isCamOn = false;
        let isFullscreen = false;
        let recognition = null;
        let speechHistory = [];
        let pendingAudio = null;
        let aiTeacherActivated = false;
        let animationCircles = [];
        let currentLesson = null;
        let currentParagraph = 0;

        function createBackgroundAnimation() {
            for (let i = 0; i < 10; i++) {
                const circle = document.createElement('div');
                circle.className = 'animated-circle';
                
                const size = Math.random() * 100 + 50;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                circle.style.left = `${Math.random() * 100}%`;
                circle.style.top = `${Math.random() * 100}%`;
                
                const colors = ['#4361ee', '#3a0ca3', '#4cc9f0', '#f72585'];
                circle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                backgroundAnimation.appendChild(circle);
                animationCircles.push(circle);
                
                anime({
                    targets: circle,
                    translateX: () => anime.random(-300, 300),
                    translateY: () => anime.random(-300, 300),
                    scale: () => anime.random(0.5, 1.5),
                    duration: () => anime.random(5000, 15000),
                    easing: 'easeInOutQuad',
                    complete: function(anim) {
                        anim.restart();
                    }
                });
            }
        }

        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                statusDiv.textContent = 'Подключено к серверу';
                socket.emit('join_room', { room_id: roomId });
                
                setTimeout(() => {
                    toggleMicrophone();
                    toggleCamera();
                }, 500);
            });
            
            socket.on('disconnect', () => {
                statusDiv.textContent = 'Отключено от сервера';
            });
            
            socket.on('animation_frame', (data) => {
                teacherVideo.src = data.frame;
            });
            
            socket.on('speech_audio', (data) => {
                try {
                    const audio = new Audio(`data:audio/mp3;base64,${data.audio}`);
                    
                    const playPromise = audio.play();
                    
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                showSpeechText(data.text, 'teacher');
                                audioOverlay.style.display = 'none';
                            })
                            .catch(error => {
                                pendingAudio = audio;
                                audioOverlay.style.display = 'flex';
                                showSpeechText(data.text, 'teacher');
                                statusDiv.textContent = 'Нажмите кнопку для воспроизведения';
                            });
                    }
                } catch (error) {
                    console.error('Ошибка воспроизведения аудио:', error);
                    showSpeechText(data.text, 'teacher');
                }
            });
            
            socket.on('speech_text', (data) => {
                showSpeechText(data.text, data.sid);
            });
            
            socket.on('participants_update', (data) => {
                participantsCount.textContent = data.count;
            });
            
            socket.on('speech_history', (data) => {
                speechHistory = data.history;
            });
            
            socket.on('ai_teacher_available', () => {
                activateAiBtn.style.display = 'block';
            });
            
            socket.on('ai_teacher_activated', () => {
                aiTeacherActivated = true;
                activateAiBtn.style.display = 'none';
                statusDiv.textContent = 'AI-Teacher активирован';
            });
            
            socket.on('speaking_state', (data) => {
                if (data.speaking) {
                    statusDiv.textContent = 'AI-Teacher говорит...';
                } else {
                    statusDiv.textContent = 'AI-Teacher готов';
                }
            });
            
            socket.on('lesson_started', (data) => {
                currentLesson = data;
                currentParagraph = 0;
                lessonTitle.textContent = `${data.subject}: ${data.title}`;
                loadLessonContent(data.lesson_id);
            });
        }

        function loadLessonContent(lessonId) {
            fetch(`/api/lesson_content/${lessonId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.content && data.content.length > 0) {
                        displayLessonParagraph(data.content);
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки урока:', error);
                });
        }

        function displayLessonParagraph(content) {
            if (currentParagraph < content.length) {
                lessonText.textContent = content[currentParagraph];
                lessonContent.style.display = 'block';
                
                anime({
                    targets: lessonText,
                    opacity: [0, 1],
                    duration: 1000,
                    easing: 'easeInOutQuad'
                });
                
                currentParagraph++;
            } else {
                lessonContent.style.display = 'none';
                currentLesson = null;
            }
        }

        audioPlayBtn.addEventListener('click', () => {
            if (pendingAudio) {
                pendingAudio.play()
                    .then(() => {
                        audioOverlay.style.display = 'none';
                        pendingAudio = null;
                    })
                    .catch(error => {
                        console.error('Ошибка воспроизведения:', error);
                        statusDiv.textContent = 'Ошибка воспроизведения';
                    });
            }
        });

        activateAiBtn.addEventListener('click', () => {
            socket.emit('activate_ai_teacher', { room_id: roomId });
        });

        function showSpeechText(text, source) {
            speechTextDiv.textContent = text;
            speechTextDiv.style.display = 'block';
            speechTextDiv.style.background = source === 'me' 
                ? 'linear-gradient(135deg, rgba(76, 201, 240, 0.8), rgba(58, 12, 163, 0.8))' 
                : 'linear-gradient(135deg, rgba(67, 97, 238, 0.8), rgba(247, 37, 133, 0.8))';
            
            anime({
                targets: speechTextDiv,
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 500,
                easing: 'easeOutQuad'
            });
            
            setTimeout(() => {
                anime({
                    targets: speechTextDiv,
                    opacity: [1, 0],
                    translateY: [0, -20],
                    duration: 500,
                    easing: 'easeInQuad',
                    complete: () => {
                        speechTextDiv.style.display = 'none';
                    }
                });
            }, 5000);
        }

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ru-RU';

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        socket.emit('recognized_speech', {
                            room_id: roomId,
                            text: finalTranscript
                        });
                        showSpeechText(finalTranscript, 'me');
                    }
                };

                recognition.onerror = (event) => {
                    console.error('Ошибка распознавания речи:', event.error);
                };
            } else {
                console.warn('Браузер не поддерживает распознавание речи');
            }
        }

        async function toggleMicrophone() {
            try {
                if (!isMicOn) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            sampleRate: 44100
                        }
                    });
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = audioStream;
                    }
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Микрофон включен';
                    
                    if (recognition) {
                        recognition.start();
                    } else {
                        initSpeechRecognition();
                        if (recognition) recognition.start();
                    }
                } else {
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                    }
                    isMicOn = false;
                    micBtn.classList.remove('active');
                    micBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Микрофон выключен';
                    
                    if (recognition) {
                        recognition.stop();
                    }
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к микрофону: ' + error.message;
                console.error('Ошибка доступа к микрофону:', error);
            }
        }

        async function toggleCamera() {
            try {
                if (!isCamOn) {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: 'user'
                        }
                    });
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = videoStream;
                    }
                    selfVideo.srcObject = userStream;
                    isCamOn = true;
                    camBtn.classList.add('active');
                    camBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Камера включена';
                    document.getElementById('self-video-container').style.display = 'block';
                } else {
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => track.stop());
                        selfVideo.srcObject = null;
                    }
                    isCamOn = false;
                    camBtn.classList.remove('active');
                    camBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Камера выключена';
                    document.getElementById('self-video-container').style.display = 'none';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к камере: ' + error.message;
                console.error('Ошибка доступа к камере:', error);
                
                if (error.name === 'NotAllowedError') {
                    statusDiv.textContent = 'Доступ к камере запрещен. Разрешите доступ в настройках браузера.';
                } else if (error.name === 'NotFoundError' || error.name === 'OverconstrainedError') {
                    statusDiv.textContent = 'Камера не найдена или недоступна.';
                }
            }
        }

        function toggleFullscreen() {
            if (!isFullscreen) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
                isFullscreen = true;
                fullscreenBtn.querySelector('span').textContent = 'Обычный';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
                fullscreenBtn.querySelector('span').textContent = 'Полный';
            }
        }

        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (recognition) {
                recognition.stop();
            }
            if (socket) {
                socket.emit('leave_room', { room_id: roomId });
                socket.disconnect();
            }
            
            if (isEmbedded) {
                window.parent.postMessage('conference_ended', '*');
            } else {
                window.location.href = '/';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            createBackgroundAnimation();
            
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            endCallBtn.addEventListener('click', endCall);

            document.getElementById('self-video-container').style.display = 'none';

            if (isEmbedded) {
                document.body.classList.add('embedded');
            }

            window.addEventListener('message', (event) => {
                if (event.data === 'end_conference') {
                    endCall();
                }
            });
            
            window.addEventListener('resize', () => {
                animationCircles.forEach(circle => circle.remove());
                animationCircles = [];
                createBackgroundAnimation();
            });
        });

        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'Обычный' : 'Полный';
        });
    </script>
</body>
</html>
