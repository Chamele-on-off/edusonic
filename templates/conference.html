<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференция</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1c1e22;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #2d3035;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404348;
        }
        #logo {
            font-weight: bold;
            font-size: 1.2rem;
        }
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        #video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        #teacher-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #self-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 20%;
            max-width: 300px;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #controls {
            background: #2d3035;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #404348;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #3d4046;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: #4e5158;
        }
        .control-btn i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        .control-btn span {
            font-size: 11px;
        }
        #fullscreen-btn {
            background: #4a4d54;
        }
        #end-call-btn {
            background: #e74c3c;
        }
        #end-call-btn:hover {
            background: #c0392b;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        .active {
            background: #4CAF50 !important;
        }
        #participants {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        /* Иконки (можно заменить на реальные) */
        .icon {
            font-family: Arial, sans-serif;
            text-align: center;
            line-height: 1;
        }
        #p2p-status {
            position: absolute;
            top: 40px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="logo">Virtual Classroom</div>
        <div id="meeting-id">Конференция #12345</div>
    </div>

    <div id="main">
        <div id="video-container">
            <video id="teacher-video" autoplay></video>
            <video id="self-video" autoplay muted></video>
            
            <div id="status">Подключение к конференции...</div>
            <div id="p2p-status">P2P: не активно</div>
            <div id="participants">Участников: 1</div>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <div class="icon">🎤</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <div class="icon">📷</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="screen-btn" title="Демонстрация экрана" disabled>
            <div class="icon">🖥️</div>
            <span>Экран</span>
        </button>
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <div class="icon">⛶</div>
            <span>Полный</span>
        </button>
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <div class="icon">📞</div>
            <span>Выйти</span>
        </button>
    </div>

    <audio id="speech-audio"></audio>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        // Элементы
        const teacherVideo = document.getElementById('teacher-video');
        const selfVideo = document.getElementById('self-video');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const screenBtn = document.getElementById('screen-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const p2pStatus = document.getElementById('p2p-status');
        const participantsDiv = document.getElementById('participants');
        const speechAudio = document.getElementById('speech-audio');
        const videoContainer = document.getElementById('video-container');
        const mainElement = document.getElementById('main');

        // Состояние
        let userStream = null;
        let socket = null;
        let peer = null;
        let teacherPeerId = null;
        let isMicOn = false;
        let isCamOn = false;
        let isFullscreen = false;

        // Инициализация Socket.io
        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                statusDiv.textContent = 'Подключено к серверу';
            });
            
            socket.on('disconnect', () => {
                statusDiv.textContent = 'Отключено от сервера';
            });
            
            socket.on('animation_frame', (data) => {
                statusDiv.textContent = `Анимация учителя: кадр ${data.index + 1}/${data.total}`;
            });
            
            socket.on('speech_audio', (data) => {
                const audioSrc = `data:audio/mp3;base64,${data.audio}`;
                speechAudio.src = audioSrc;
                speechAudio.play().catch(e => console.log('Автовоспроизведение заблокировано', e));
            });
            
            socket.on('participants_update', (data) => {
                participantsDiv.textContent = `Участников: ${data.count}`;
            });
            
            socket.on('peer_id', (data) => {
                teacherPeerId = data.peer_id;
                p2pStatus.textContent = `P2P: учитель найден (ID: ${teacherPeerId})`;
                connectToTeacher();
            });
        }

        // Инициализация PeerJS
        function initPeerJS() {
            peer = new Peer();
            
            peer.on('open', (id) => {
                p2pStatus.textContent = `P2P: мой ID ${id}`;
            });
            
            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    teacherVideo.srcObject = remoteStream;
                    p2pStatus.textContent = 'P2P: получен поток от учителя';
                });
            });
            
            peer.on('error', (err) => {
                p2pStatus.textContent = `P2P ошибка: ${err}`;
            });
        }

        // Подключение к учителю
        function connectToTeacher() {
            if (!teacherPeerId || !peer) return;
            
            const conn = peer.connect(teacherPeerId);
            
            conn.on('open', () => {
                p2pStatus.textContent = 'P2P: подключение к учителю установлено';
                
                // Запрашиваем поток
                const call = peer.call(teacherPeerId, new MediaStream());
                call.on('stream', (remoteStream) => {
                    teacherVideo.srcObject = remoteStream;
                    p2pStatus.textContent = 'P2P: получен видеопоток от учителя';
                });
            });
            
            conn.on('error', (err) => {
                p2pStatus.textContent = `P2P ошибка соединения: ${err}`;
            });
        }

        // Управление микрофоном
        async function toggleMicrophone() {
            try {
                if (!isMicOn) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                        audioStream.getAudioTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = audioStream;
                    }
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Микрофон включен';
                } else {
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                    }
                    isMicOn = false;
                    micBtn.classList.remove('active');
                    micBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Микрофон выключен';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к микрофону: ' + error.message;
            }
        }

        // Управление камерой
        async function toggleCamera() {
            try {
                if (!isCamOn) {
                    userStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    selfVideo.srcObject = userStream;
                    isCamOn = true;
                    camBtn.classList.add('active');
                    camBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Камера включена';
                    selfVideo.style.display = 'block';
                } else {
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => track.stop());
                        selfVideo.srcObject = null;
                    }
                    isCamOn = false;
                    camBtn.classList.remove('active');
                    camBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Камера выключена';
                    selfVideo.style.display = 'none';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к камере: ' + error.message;
            }
        }

        // Полноэкранный режим
        function toggleFullscreen() {
            if (!isFullscreen) {
                if (mainElement.requestFullscreen) {
                    mainElement.requestFullscreen();
                } else if (mainElement.webkitRequestFullscreen) {
                    mainElement.webkitRequestFullscreen();
                } else if (mainElement.msRequestFullscreen) {
                    mainElement.msRequestFullscreen();
                }
                isFullscreen = true;
                fullscreenBtn.querySelector('span').textContent = 'Обычный';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
                fullscreenBtn.querySelector('span').textContent = 'Полный';
            }
        }

        // Завершение вызова
        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (socket) {
                socket.disconnect();
            }
            if (peer) {
                peer.destroy();
            }
            window.location.href = '/';
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            initPeerJS();
            
            // Обработчики кнопок
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            endCallBtn.addEventListener('click', endCall);

            // Скрыть свое видео по умолчанию
            selfVideo.style.display = 'none';

            // Обработчик изменения размера окна
            window.addEventListener('resize', () => {
                // Можно добавить адаптацию интерфейса при изменении размера
            });
        });

        // Обработчик выхода из полноэкранного режима
        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'Обычный' : 'Полный';
        });
    </script>
</body>
</html>
