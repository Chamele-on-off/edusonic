<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференция</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1c1e22;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #2d3035;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404348;
        }
        #logo {
            font-weight: bold;
            font-size: 1.2rem;
        }
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        #video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        #teacher-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #self-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 20%;
            max-width: 300px;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #controls {
            background: #2d3035;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #404348;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #3d4046;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: #4e5158;
        }
        .control-btn i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        .control-btn span {
            font-size: 11px;
        }
        #fullscreen-btn {
            background: #4a4d54;
        }
        #end-call-btn {
            background: #e74c3c;
        }
        #end-call-btn:hover {
            background: #c0392b;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        .active {
            background: #4CAF50 !important;
        }
        #participants {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #room-info {
            position: absolute;
            top: 40px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #speech-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 4px;
            max-width: 80%;
            text-align: center;
            display: none;
        }
        #lip-sync-container {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .lip-sync-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.1s;
        }
        .lip-sync-active {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.3);
        }
        body.embedded {
            height: auto;
        }
        body.embedded #header {
            display: none;
        }
        body.embedded #controls {
            padding: 5px;
        }
        body.embedded .control-btn {
            width: 40px;
            height: 40px;
            font-size: 12px;
        }
    </style>
</head>
<body class="{{ 'embedded' if embed else '' }}">
    {% if not embed %}
    <div id="header">
        <div id="logo">Virtual Classroom</div>
        <div id="meeting-id">Конференция</div>
    </div>
    {% endif %}

    <div id="main">
        <div id="video-container">
            <img id="teacher-video" src="" alt="Анимация учителя">
            <video id="self-video" autoplay muted></video>
            
            <div id="status">Подключение к конференции...</div>
            <div id="room-info">Комната: <span id="room-name">default</span></div>
            <div id="participants">Участников: 1</div>
            <div id="speech-text"></div>
            <div id="lip-sync-container">
                <div class="lip-sync-indicator" id="lip-sync-1"></div>
                <div class="lip-sync-indicator" id="lip-sync-2"></div>
                <div class="lip-sync-indicator" id="lip-sync-3"></div>
                <div class="lip-sync-indicator" id="lip-sync-4"></div>
                <div class="lip-sync-indicator" id="lip-sync-5"></div>
            </div>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <div class="icon">🎤</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <div class="icon">📷</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="screen-btn" title="Демонстрация экрана" disabled>
            <div class="icon">🖥️</div>
            <span>Экран</span>
        </button>
        {% if not embed %}
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <div class="icon">⛶</div>
            <span>Полный</span>
        </button>
        {% endif %}
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <div class="icon">📞</div>
            <span>Выйти</span>
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const isEmbedded = window.location.search.includes('embed=true');
        document.getElementById('room-name').textContent = roomId;
        
        const teacherVideo = document.getElementById('teacher-video');
        const selfVideo = document.getElementById('self-video');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const screenBtn = document.getElementById('screen-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const participantsDiv = document.getElementById('participants');
        const speechTextDiv = document.getElementById('speech-text');
        const videoContainer = document.getElementById('video-container');
        const mainElement = document.getElementById('main');
        const lipSyncIndicators = [
            document.getElementById('lip-sync-1'),
            document.getElementById('lip-sync-2'),
            document.getElementById('lip-sync-3'),
            document.getElementById('lip-sync-4'),
            document.getElementById('lip-sync-5')
        ];

        let userStream = null;
        let socket = null;
        let isMicOn = false;
        let isCamOn = false;
        let isFullscreen = false;
        let recognition = null;
        let speechHistory = [];
        let audioContext = null;
        let analyser = null;
        let scriptProcessor = null;
        let lipSyncInterval = null;
        let lastSpeechTime = 0;
        let isServerSpeechPlaying = false;

        const phonemes = {
            'а': ['mouth_aa_001.jpg', 'mouth_aa_002.jpg', 'mouth_aa_003.jpg'],
            'б': ['mouth_bb_001.jpg', 'mouth_bb_002.jpg'],
            'в': ['mouth_vv_001.jpg', 'mouth_vv_002.jpg'],
            'г': ['mouth_kk_001.jpg'],
            'д': ['mouth_dd_001.jpg'],
            'е': ['mouth_ee_001.jpg', 'mouth_ee_002.jpg'],
            'ж': ['mouth_zh_001.jpg', 'mouth_zh_002.jpg'],
            'з': ['mouth_zz_001.jpg', 'mouth_zz_002.jpg'],
            'и': ['mouth_ee_001.jpg', 'mouth_ee_002.jpg'],
            'й': ['mouth_ee_001.jpg'],
            'к': ['mouth_kk_001.jpg'],
            'л': ['mouth_ll_001.jpg', 'mouth_ll_002.jpg'],
            'м': ['mouth_bb_001.jpg'],
            'н': ['mouth_nn_001.jpg'],
            'о': ['mouth_oo_001.jpg', 'mouth_oo_002.jpg'],
            'п': ['mouth_pp_001.jpg', 'mouth_pp_002.jpg'],
            'р': ['mouth_rr_001.jpg'],
            'с': ['mouth_ss_001.jpg', 'mouth_ss_002.jpg'],
            'т': ['mouth_tt_001.jpg'],
            'у': ['mouth_uu_001.jpg', 'mouth_uu_002.jpg'],
            'ф': ['mouth_ff_001.jpg'],
            'х': ['mouth_hh_001.jpg'],
            'ц': ['mouth_ss_001.jpg'],
            'ч': ['mouth_ch_001.jpg', 'mouth_ch_002.jpg'],
            'ш': ['mouth_sh_001.jpg', 'mouth_sh_002.jpg'],
            'щ': ['mouth_sh_001.jpg'],
            'ы': ['mouth_uu_003.jpg', 'mouth_uu_004.jpg'],
            'э': ['mouth_ee_003.jpg', 'mouth_ee_004.jpg'],
            'ю': ['mouth_uu_001.jpg'],
            'я': ['mouth_aa_004.jpg']
        };

        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                statusDiv.textContent = 'Подключено к серверу';
                socket.emit('join_room', { room_id: roomId });
                
                setTimeout(() => {
                    toggleMicrophone();
                    toggleCamera();
                }, 500);
            });
            
            socket.on('disconnect', () => {
                statusDiv.textContent = 'Отключено от сервера';
            });
            
            socket.on('animation_frame', (data) => {
                teacherVideo.src = data.frame;
                statusDiv.textContent = `Анимация учителя: кадр ${data.index + 1}/${data.total}`;
            });
            
            socket.on('speech_request', (data) => {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(data.text);
                    utterance.lang = data.lang || 'ru-RU';
                    
                    if (data.voice) {
                        const voices = speechSynthesis.getVoices();
                        const selectedVoice = voices.find(v => v.name === data.voice);
                        if (selectedVoice) {
                            utterance.voice = selectedVoice;
                        }
                    }
                    
                    utterance.onstart = () => {
                        isServerSpeechPlaying = true;
                        showSpeechText(data.text, 'teacher');
                        setupAudioAnalysis();
                    };
                    
                    utterance.onend = () => {
                        isServerSpeechPlaying = false;
                        resetLipSync();
                    };
                    
                    utterance.onboundary = (event) => {
                        if (event.name === 'word') {
                            const word = data.text.substring(event.charIndex, event.charIndex + event.charLength);
                            animateLipsForSpeech(word.toLowerCase());
                        }
                    };
                    
                    speechSynthesis.speak(utterance);
                }
            });
            
            socket.on('speech_text', (data) => {
                if (data.sid !== socket.id) {
                    showSpeechText(data.text, data.sid);
                }
            });
            
            socket.on('participants_update', (data) => {
                participantsDiv.textContent = `Участников: ${data.count}`;
            });
            
            socket.on('speech_history', (data) => {
                speechHistory = data.history;
            });
        }

        function setupAudioAnalysis() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 32;
                
                const source = audioContext.createMediaElementSource(speechAudio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                
                scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
                scriptProcessor.onaudioprocess = processAudio;
                analyser.connect(scriptProcessor);
            }
            
            if (lipSyncInterval) clearInterval(lipSyncInterval);
            lipSyncInterval = setInterval(updateLipSync, 50);
        }

        function processAudio() {
            const array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);
            
            const volume = array.reduce((a, b) => a + b, 0) / array.length;
            if (volume > 10) {
                lastSpeechTime = Date.now();
            }
        }

        function updateLipSync() {
            const timeSinceLastSpeech = Date.now() - lastSpeechTime;
            const isSpeaking = timeSinceLastSpeech < 100;
            
            lipSyncIndicators.forEach((indicator, i) => {
                if (isSpeaking && Math.random() > 0.7) {
                    indicator.classList.add('lip-sync-active');
                    setTimeout(() => {
                        indicator.classList.remove('lip-sync-active');
                    }, 50);
                }
            });
        }

        function animateLipsForSpeech(text) {
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (phonemes[char]) {
                    const frames = phonemes[char];
                    const randomFrame = frames[Math.floor(Math.random() * frames.length)];
                    // Здесь можно обновить изображение аватара
                    break;
                }
            }
        }

        function resetLipSync() {
            if (lipSyncInterval) {
                clearInterval(lipSyncInterval);
                lipSyncInterval = null;
            }
            lipSyncIndicators.forEach(indicator => {
                indicator.classList.remove('lip-sync-active');
            });
        }

        function showSpeechText(text, source) {
            speechTextDiv.textContent = text;
            speechTextDiv.style.display = 'block';
            speechTextDiv.style.color = source === 'me' ? '#4CAF50' : '#3498db';
            
            setTimeout(() => {
                speechTextDiv.style.display = 'none';
            }, 5000);
        }

        async function toggleMicrophone() {
            try {
                if (!isMicOn) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = audioStream;
                    }
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Микрофон включен';
                    
                    if (recognition) {
                        recognition.start();
                    } else {
                        initSpeechRecognition();
                        if (recognition) recognition.start();
                    }
                } else {
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                    }
                    isMicOn = false;
                    micBtn.classList.remove('active');
                    micBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Микрофон выключен';
                    
                    if (recognition) {
                        recognition.stop();
                    }
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к микрофону: ' + error.message;
            }
        }

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ru-RU';

                recognition.onresult = (event) => {
                    if (isServerSpeechPlaying) return;
                    
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        socket.emit('recognized_speech', {
                            room_id: roomId,
                            text: finalTranscript
                        });
                        showSpeechText(finalTranscript, 'me');
                    }
                };

                recognition.onerror = (event) => {
                    console.error('Ошибка распознавания речи:', event.error);
                };
            }
        }

        async function toggleCamera() {
            try {
                if (!isCamOn) {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = videoStream;
                    }
                    selfVideo.srcObject = userStream;
                    isCamOn = true;
                    camBtn.classList.add('active');
                    camBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Камера включена';
                    selfVideo.style.display = 'block';
                } else {
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => track.stop());
                        selfVideo.srcObject = null;
                    }
                    isCamOn = false;
                    camBtn.classList.remove('active');
                    camBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Камера выключена';
                    selfVideo.style.display = 'none';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к камере: ' + error.message;
            }
        }

        function toggleFullscreen() {
            if (!isFullscreen) {
                if (mainElement.requestFullscreen) {
                    mainElement.requestFullscreen();
                } else if (mainElement.webkitRequestFullscreen) {
                    mainElement.webkitRequestFullscreen();
                } else if (mainElement.msRequestFullscreen) {
                    mainElement.msRequestFullscreen();
                }
                isFullscreen = true;
                if (fullscreenBtn) fullscreenBtn.querySelector('span').textContent = 'Обычный';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
                if (fullscreenBtn) fullscreenBtn.querySelector('span').textContent = 'Полный';
            }
        }

        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (recognition) {
                recognition.stop();
            }
            if (audioContext) {
                audioContext.close();
            }
            if (lipSyncInterval) {
                clearInterval(lipSyncInterval);
            }
            if (socket) {
                socket.emit('leave_room', { room_id: roomId });
                socket.disconnect();
            }
            
            if (isEmbedded) {
                window.parent.postMessage('conference_ended', '*');
            } else {
                window.location.href = '/';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', toggleFullscreen);
            }
            endCallBtn.addEventListener('click', endCall);

            selfVideo.style.display = 'none';

            if (isEmbedded) {
                document.body.classList.add('embedded');
            }

            window.addEventListener('message', (event) => {
                if (event.data === 'end_conference') {
                    endCall();
                }
            });
        });

        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            if (fullscreenBtn) {
                fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'Обычный' : 'Полный';
            }
        });
    </script>
</body>
</html>
