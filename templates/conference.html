<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальный класс</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --danger: #f72585;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
            --teacher-color: #4cc9f0;
            --student-color: #f72585;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        #header {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        #logo {
            font-weight: bold;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        
        #video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .animated-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
        }
        
        #lesson-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            max-width: 90%;
            max-height: 80%;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 5;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            -webkit-overflow-scrolling: touch;
        }
        
        #lesson-content h2 {
            margin-bottom: 20px;
            color: var(--success);
            text-align: center;
            font-size: 1.5rem;
        }
        
        #lesson-text {
            font-size: 1.2rem;
            line-height: 1.6;
            text-align: center;
        }
        
        #teacher-video-container {
            position: absolute;
            bottom: 100px;
            right: 20px;
            border: 3px solid var(--teacher-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(76, 201, 240, 0.3);
            z-index: 10;
            background: black;
            transition: all 0.3s ease;
        }
        
        #teacher-video {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        #teacher-speech {
            position: absolute;
            bottom: calc(100% + 10px);
            right: 0;
            background: linear-gradient(135deg, var(--teacher-color), #3a86ff);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            max-width: 250px;
            font-size: 14px;
            z-index: 11;
            display: none;
            box-shadow: 0 8px 20px rgba(76, 201, 240, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: speechAppear 0.3s ease-out;
        }
        
        @keyframes speechAppear {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        #self-video-container {
            position: absolute;
            bottom: 100px;
            left: 20px;
            width: 200px;
            height: 150px;
            border: 3px solid var(--student-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(247, 37, 133, 0.3);
            z-index: 10;
            background: black;
        }
        
        #self-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #student-speech {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 0;
            background: linear-gradient(135deg, var(--student-color), #ff6b6b);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            max-width: 250px;
            font-size: 14px;
            z-index: 11;
            display: none;
            box-shadow: 0 8px 20px rgba(247, 37, 133, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: speechAppear 0.3s ease-out;
        }
        
        #status-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 80%;
        }
        
        #participants {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #controls {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 20px;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .control-btn.active {
            background: var(--primary);
        }
        
        .control-btn span {
            font-size: 12px;
            margin-top: 4px;
        }
        
        #end-call-btn {
            background: var(--danger);
        }
        
        #end-call-btn:active {
            background: #e01b74;
            transform: scale(0.95);
        }
        
        #activate-ai-btn {
            position: absolute;
            bottom: 270px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #activate-ai-btn:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        .camera-permission {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 20;
            display: none;
        }
        
        .camera-permission button {
            margin-top: 15px;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        
        @media (max-width: 768px) {
            #header {
                padding: 10px 15px;
            }
            
            #logo {
                font-size: 1.1rem;
            }
            
            #teacher-video-container {
                width: 150px;
                height: 112px;
                bottom: 90px;
                right: 15px;
            }
            
            #self-video-container {
                width: 150px;
                height: 112px;
                bottom: 90px;
                left: 15px;
            }
            
            #teacher-speech,
            #student-speech {
                max-width: 200px;
                font-size: 13px;
                padding: 10px 16px;
            }
            
            #controls {
                padding: 10px;
                gap: 10px;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }
            
            .control-btn span {
                font-size: 10px;
            }
            
            #activate-ai-btn {
                bottom: 220px;
                padding: 12px 24px;
                font-size: 16px;
            }
            
            #lesson-content {
                padding: 20px;
                max-width: 95%;
            }
            
            #lesson-content h2 {
                font-size: 1.3rem;
            }
            
            #lesson-text {
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            #teacher-video-container {
                width: 120px;
                height: 90px;
                bottom: 80px;
                right: 10px;
            }
            
            #self-video-container {
                width: 120px;
                height: 90px;
                bottom: 80px;
                left: 10px;
            }
            
            #teacher-speech,
            #student-speech {
                max-width: 180px;
                font-size: 12px;
                padding: 8px 14px;
                bottom: calc(100% + 8px);
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 16px;
            }
            
            #status-container {
                font-size: 12px;
                padding: 8px 12px;
                max-width: 70%;
            }
            
            #activate-ai-btn {
                bottom: 200px;
                padding: 10px 20px;
                font-size: 14px;
            }
            
            #lesson-content {
                padding: 15px;
            }
            
            #lesson-content h2 {
                font-size: 1.2rem;
                margin-bottom: 15px;
            }
            
            #lesson-text {
                font-size: 1rem;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-out {
            animation: slideOut 0.5s ease forwards;
        }
        
        @keyframes slideOut {
            from { 
                opacity: 1; 
                transform: translateY(0) scale(1);
            }
            to { 
                opacity: 0; 
                transform: translateY(-20px) scale(0.95);
            }
        }
        
        body.embedded {
            height: auto;
        }
        
        body.embedded #header {
            display: none;
        }
        
        body.embedded #controls {
            padding: 10px;
        }
        
        body.embedded .control-btn {
            width: 50px;
            height: 50px;
            font-size: 16px;
        }
        
        /* iOS specific fixes */
        @supports (-webkit-touch-callout: none) {
            body {
                height: -webkit-fill-available;
            }
            
            #main {
                height: -webkit-fill-available;
            }
            
            .control-btn {
                cursor: default;
            }
        }
    </style>
</head>
<body>
    <div id="header" class="fade-in">
        <div id="logo">
            <i class="fas fa-chalkboard-teacher"></i>
            <span>Виртуальный класс</span>
        </div>
        <div id="meeting-id">Комната: <span id="room-name">default</span></div>
    </div>

    <div id="main">
        <div id="video-container">
            <div id="background-animation"></div>
            
            <div id="lesson-content">
                <h2 id="lesson-title"></h2>
                <div id="lesson-text"></div>
            </div>
            
            <div id="teacher-video-container" class="fade-in">
                <img id="teacher-video" src="" alt="Аватар учителя">
                <div id="teacher-speech"></div>
            </div>
            
            <div id="self-video-container" class="fade-in">
                <video id="self-video" autoplay muted playsinline></video>
                <div id="student-speech"></div>
            </div>
            
            <div id="status-container" class="fade-in">
                <div id="status">Подключение к конференции...</div>
                <div id="participants">
                    <i class="fas fa-users"></i>
                    <span id="participants-count">1</span> участников
                </div>
            </div>
            
            <button id="activate-ai-btn" class="fade-in">Activate AI-Teacher</button>
            
            <div class="camera-permission fade-in" id="camera-permission">
                <p>Разрешите доступ к камере и микрофону для участия в конференции</p>
                <button id="enable-camera-btn">Разрешить доступ</button>
            </div>
        </div>
    </div>

    <div id="controls" class="fade-in">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <i class="fas fa-microphone"></i>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <i class="fas fa-video"></i>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="screen-btn" title="Демонстрация экрана" disabled>
            <i class="fas fa-desktop"></i>
            <span>Экран</span>
        </button>
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <i class="fas fa-expand"></i>
            <span>Полный</span>
        </button>
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <i class="fas fa-phone-slash"></i>
            <span>Выйти</span>
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const isEmbedded = window.location.search.includes('embed=true');
        document.getElementById('room-name').textContent = roomId;
        
        const teacherVideo = document.getElementById('teacher-video');
        const selfVideo = document.getElementById('self-video');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const screenBtn = document.getElementById('screen-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const participantsCount = document.getElementById('participants-count');
        const teacherSpeech = document.getElementById('teacher-speech');
        const studentSpeech = document.getElementById('student-speech');
        const activateAiBtn = document.getElementById('activate-ai-btn');
        const lessonContent = document.getElementById('lesson-content');
        const lessonTitle = document.getElementById('lesson-title');
        const lessonText = document.getElementById('lesson-text');
        const backgroundAnimation = document.getElementById('background-animation');
        const cameraPermission = document.getElementById('camera-permission');
        const enableCameraBtn = document.getElementById('enable-camera-btn');

        let userStream = null;
        let socket = null;
        let isMicOn = false;
        let isCamOn = false;
        let isFullscreen = false;
        let recognition = null;
        let aiTeacherActivated = false;
        let animationCircles = [];
        let currentLesson = null;
        let currentParagraph = 0;
        let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        let currentTypingAnimation = null;
        let currentLessonContent = [];
        let devicesEnabled = false;
        let currentAvatarAspectRatio = 1;
        let isLessonActive = false;

        function createBackgroundAnimation() {
            for (let i = 0; i < 8; i++) {
                const circle = document.createElement('div');
                circle.className = 'animated-circle';
                
                const size = Math.random() * 80 + 40;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                circle.style.left = `${Math.random() * 100}%`;
                circle.style.top = `${Math.random() * 100}%`;
                
                const colors = ['#4361ee', '#3a0ca3', '#4cc9f0', '#f72585'];
                circle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                backgroundAnimation.appendChild(circle);
                animationCircles.push(circle);
                
                anime({
                    targets: circle,
                    translateX: () => anime.random(-200, 200),
                    translateY: () => anime.random(-200, 200),
                    scale: () => anime.random(0.5, 1.2),
                    duration: () => anime.random(4000, 12000),
                    easing: 'easeInOutQuad',
                    complete: function(anim) {
                        anim.restart();
                    }
                });
            }
        }

        function adjustTeacherVideoSize(img) {
            if (img.naturalWidth && img.naturalHeight) {
                currentAvatarAspectRatio = img.naturalWidth / img.naturalHeight;
                const teacherContainer = document.getElementById('teacher-video-container');
                
                if (currentAvatarAspectRatio > 1) {
                    // Горизонтальное изображение
                    teacherContainer.style.width = '200px';
                    teacherContainer.style.height = '150px';
                } else {
                    // Вертикальное изображение
                    teacherContainer.style.width = '150px';
                    teacherContainer.style.height = '200px';
                }
            }
        }

        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                statusDiv.textContent = 'Подключено к серверу';
                socket.emit('join_room', { room_id: roomId });
                
                // Автоматически включаем камеру и микрофон
                setTimeout(() => {
                    enableCameraAndMicrophone();
                }, 1000);
            });
            
            socket.on('disconnect', () => {
                statusDiv.textContent = 'Отключено от сервера';
            });
            
            socket.on('animation_frame', (data) => {
                teacherVideo.onload = function() {
                    adjustTeacherVideoSize(this);
                };
                teacherVideo.src = data.frame;
            });
            
            socket.on('speech_audio', (data) => {
                try {
                    const audio = new Audio(`data:audio/mp3;base64,${data.audio}`);
                    
                    const playPromise = audio.play();
                    
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                if (!isLessonActive) {
                                    showTeacherSpeech(data.text);
                                }
                            })
                            .catch(error => {
                                console.error('Ошибка автовоспроизведения:', error);
                                if (!isLessonActive) {
                                    showTeacherSpeech(data.text);
                                }
                            });
                    }
                } catch (error) {
                    console.error('Ошибка воспроизведения аудио:', error);
                    if (!isLessonActive) {
                        showTeacherSpeech(data.text);
                    }
                }
            });
            
            socket.on('speech_text', (data) => {
                if (data.is_teacher) {
                    if (!isLessonActive) {
                        showTeacherSpeech(data.text);
                    }
                    // Обновляем текст урока если это урок
                    if (currentLesson && data.text.startsWith('Учитель: ')) {
                        const lessonText = data.text.replace('Учитель: ', '');
                        updateLessonText(lessonText);
                    }
                } else {
                    showStudentSpeech(data.text, data.sid);
                }
            });
            
            socket.on('participants_update', (data) => {
                participantsCount.textContent = data.count;
            });
            
            socket.on('ai_teacher_available', () => {
                if (devicesEnabled) {
                    activateAiBtn.style.display = 'block';
                }
            });
            
            socket.on('ai_teacher_activated', () => {
                aiTeacherActivated = true;
                activateAiBtn.style.display = 'none';
                statusDiv.textContent = 'AI-Teacher активирован';
            });
            
            socket.on('speaking_state', (data) => {
                if (data.speaking) {
                    statusDiv.textContent = 'AI-Teacher говорит...';
                } else {
                    statusDiv.textContent = 'AI-Teacher готов';
                }
            });
            
            socket.on('lesson_started', (data) => {
                isLessonActive = true;
                currentLesson = data;
                currentParagraph = 0;
                lessonTitle.textContent = `${data.subject}: ${data.title}`;
                loadLessonContent(data.lesson_id);
            });
        }

        async function enableCameraAndMicrophone() {
            try {
                // Запрашиваем доступ к камере и микрофону одновременно
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    }
                });
                
                userStream = stream;
                
                // Включаем камеру
                selfVideo.srcObject = userStream;
                isCamOn = true;
                camBtn.classList.add('active');
                camBtn.querySelector('span').textContent = 'Выкл';
                document.getElementById('self-video-container').style.display = 'block';
                
                // Включаем микрофон
                isMicOn = true;
                micBtn.classList.add('active');
                micBtn.querySelector('span').textContent = 'Выкл';
                
                // Запускаем распознавание речи
                if (recognition) {
                    recognition.start();
                }
                
                statusDiv.textContent = 'Камера и микрофон включены';
                cameraPermission.style.display = 'none';
                devicesEnabled = true;
                
                // Показываем кнопку активации AI-учителя
                activateAiBtn.style.display = 'block';
                
            } catch (error) {
                console.error('Ошибка доступа к камере/микрофону:', error);
                cameraPermission.style.display = 'block';
                
                if (error.name === 'NotAllowedError') {
                    statusDiv.textContent = 'Доступ к камере/микрофону запрещен';
                } else {
                    statusDiv.textContent = 'Ошибка доступа к устройствам';
                }
            }
        }

        function loadLessonContent(lessonId) {
            fetch(`/api/lesson_content/${lessonId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.content && data.content.length > 0) {
                        currentLessonContent = data.content;
                        displayLessonParagraph(0);
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки урока:', error);
                });
        }

        function displayLessonParagraph(paragraphIndex) {
            if (paragraphIndex < currentLessonContent.length) {
                const paragraph = currentLessonContent[paragraphIndex];
                
                // Анимация исчезновения предыдущего текста
                if (lessonText.textContent !== '') {
                    lessonText.classList.add('slide-out');
                    setTimeout(() => {
                        lessonText.classList.remove('slide-out');
                        lessonText.textContent = '';
                        animateTextTyping(paragraph);
                    }, 500);
                } else {
                    animateTextTyping(paragraph);
                }
                
                currentParagraph = paragraphIndex + 1;
            } else {
                // Урок завершен
                lessonContent.style.display = 'none';
                currentLesson = null;
                isLessonActive = false;
            }
        }

        function updateLessonText(text) {
            if (currentLesson) {
                const paragraphIndex = currentLessonContent.indexOf(text);
                if (paragraphIndex !== -1 && paragraphIndex >= currentParagraph) {
                    displayLessonParagraph(paragraphIndex);
                } else if (paragraphIndex === -1) {
                    // Новый текст, которого нет в текущем контенте
                    animateTextTyping(text);
                }
            }
        }

        function animateTextTyping(text) {
            lessonContent.style.display = 'block';
            
            if (currentTypingAnimation) {
                clearInterval(currentTypingAnimation);
            }
            
            lessonText.textContent = '';
            let currentIndex = 0;
            const typingSpeed = 30; // ms per character
            
            currentTypingAnimation = setInterval(() => {
                if (currentIndex < text.length) {
                    lessonText.textContent += text.charAt(currentIndex);
                    currentIndex++;
                    
                    // Прокрутка к последнему символу
                    lessonContent.scrollTop = lessonContent.scrollHeight;
                } else {
                    clearInterval(currentTypingAnimation);
                }
            }, typingSpeed);
        }

        function showTeacherSpeech(text) {
            const cleanText = text.replace('Учитель: ', '');
            teacherSpeech.textContent = cleanText;
            teacherSpeech.style.display = 'block';
            
            setTimeout(() => {
                teacherSpeech.style.display = 'none';
            }, 5000);
        }

        function showStudentSpeech(text, sid) {
            studentSpeech.textContent = text;
            studentSpeech.style.display = 'block';
            
            setTimeout(() => {
                studentSpeech.style.display = 'none';
            }, 5000);
        }

        activateAiBtn.addEventListener('click', () => {
            socket.emit('activate_ai_teacher', { room_id: roomId });
        });

        async function toggleMicrophone() {
            try {
                if (!isMicOn) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            sampleRate: 44100
                        }
                    });
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = audioStream;
                    }
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Микрофон включен';
                    
                    if (recognition) {
                        recognition.start();
                    }
                } else {
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                    }
                    isMicOn = false;
                    micBtn.classList.remove('active');
                    micBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Микрофон выключен';
                    
                    if (recognition) {
                        recognition.stop();
                    }
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к микрофону';
                console.error('Ошибка доступа к микрофону:', error);
            }
        }

        async function toggleCamera() {
            try {
                if (!isCamOn) {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: 'user'
                        }
                    });
                    
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = videoStream;
                    }
                    
                    selfVideo.srcObject = userStream;
                    isCamOn = true;
                    camBtn.classList.add('active');
                    camBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Камера включена';
                    document.getElementById('self-video-container').style.display = 'block';
                    cameraPermission.style.display = 'none';
                } else {
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => track.stop());
                        selfVideo.srcObject = null;
                    }
                    isCamOn = false;
                    camBtn.classList.remove('active');
                    camBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Камера выключена';
                    document.getElementById('self-video-container').style.display = 'none';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к камере';
                console.error('Ошибка доступа к камере:', error);
                
                if (error.name === 'NotAllowedError') {
                    cameraPermission.style.display = 'block';
                }
            }
        }

        enableCameraBtn.addEventListener('click', async () => {
            await enableCameraAndMicrophone();
        });

        function toggleFullscreen() {
            if (!isFullscreen) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
                isFullscreen = true;
                fullscreenBtn.querySelector('span').textContent = 'Обычный';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
                fullscreenBtn.querySelector('span').textContent = 'Полный';
            }
        }

        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (recognition) {
                recognition.stop();
            }
            if (socket) {
                socket.emit('leave_room', { room_id: roomId });
                socket.disconnect();
            }
            
            if (isEmbedded) {
                window.parent.postMessage('conference_ended', '*');
            } else {
                window.location.href = '/';
            }
        }

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ru-RU';

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        socket.emit('recognized_speech', {
                            room_id: roomId,
                            text: finalTranscript
                        });
                        showStudentSpeech(finalTranscript, 'me');
                    }
                };

                recognition.onerror = (event) => {
                    console.error('Ошибка распознавания речи:', event.error);
                };

                recognition.onend = () => {
                    if (isMicOn) {
                        recognition.start();
                    }
                };
            } else {
                console.warn('Распознавание речи не поддерживается в этом браузере');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            createBackgroundAnimation();
            initSpeechRecognition();
            
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            endCallBtn.addEventListener('click', endCall);

            if (isEmbedded) {
                document.body.classList.add('embedded');
            }

            window.addEventListener('message', (event) => {
                if (event.data === 'end_conference') {
                    endCall();
                }
            });
            
            window.addEventListener('resize', () => {
                animationCircles.forEach(circle => circle.remove());
                animationCircles = [];
                createBackgroundAnimation();
            });
        });

        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'Обычный' : 'Полный';
        });
    </script>
</body>
</html>
