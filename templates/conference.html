<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференция</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1c1e22;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #2d3035;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404348;
        }
        #logo {
            font-weight: bold;
            font-size: 1.2rem;
        }
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        #video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        #teacher-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        #self-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 20%;
            max-width: 300px;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #controls {
            background: #2d3035;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #404348;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #3d4046;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: #4e5158;
        }
        .control-btn i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        .control-btn span {
            font-size: 11px;
        }
        #fullscreen-btn {
            background: #4a4d54;
        }
        #end-call-btn {
            background: #e74c3c;
        }
        #end-call-btn:hover {
            background: #c0392b;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        .active {
            background: #4CAF50 !important;
        }
        #participants {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #room-info {
            position: absolute;
            top: 40px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #speech-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 4px;
            max-width: 80%;
            text-align: center;
            display: none;
        }
        #subtitles {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 4px;
            max-width: 80%;
            text-align: center;
            color: #4CAF50;
            font-size: 16px;
            display: none;
        }
        #no-stream {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-size: 18px;
            text-align: center;
        }
        body.embedded {
            height: auto;
        }
        body.embedded #header {
            display: none;
        }
        body.embedded #controls {
            padding: 5px;
        }
        body.embedded .control-btn {
            width: 40px;
            height: 40px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="logo">Virtual Classroom</div>
        <div id="meeting-id">Конференция</div>
    </div>

    <div id="main">
        <div id="video-container">
            <video id="teacher-video" autoplay playsinline></video>
            <video id="self-video" autoplay muted playsinline></video>
            <div id="no-stream">Ожидание трансляции от учителя...</div>
            
            <div id="status">Подключение к конференции...</div>
            <div id="room-info">Комната: <span id="room-name">default</span></div>
            <div id="participants">Участников: 1</div>
            <div id="speech-text"></div>
            <div id="subtitles"></div>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <div class="icon">🎤</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <div class="icon">📷</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="screen-btn" title="Демонстрация экрана" disabled>
            <div class="icon">🖥️</div>
            <span>Экран</span>
        </button>
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <div class="icon">⛶</div>
            <span>Полный</span>
        </button>
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <div class="icon">📞</div>
            <span>Выйти</span>
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const isEmbedded = urlParams.has('embed');
        document.getElementById('room-name').textContent = roomId;
        
        const teacherVideo = document.getElementById('teacher-video');
        const selfVideo = document.getElementById('self-video');
        const noStreamMsg = document.getElementById('no-stream');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const screenBtn = document.getElementById('screen-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const participantsDiv = document.getElementById('participants');
        const speechTextDiv = document.getElementById('speech-text');
        const subtitlesDiv = document.getElementById('subtitles');
        const videoContainer = document.getElementById('video-container');
        const mainElement = document.getElementById('main');

        let userStream = null;
        let socket = null;
        let isMicOn = false;
        let isCamOn = false;
        let isFullscreen = false;
        let recognition = null;
        let peerConnection = null;
        let dataChannel = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        // Конфигурация WebRTC (STUN серверы)
        const rtcConfiguration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                reconnectAttempts = 0;
                statusDiv.textContent = 'Подключено к серверу';
                socket.emit('join_room', { room_id: roomId });
                initWebRTC();
                initSpeechRecognition();
            });
            
            socket.on('disconnect', () => {
                statusDiv.textContent = 'Отключено от сервера';
                if (reconnectAttempts < maxReconnectAttempts) {
                    setTimeout(() => {
                        reconnectAttempts++;
                        statusDiv.textContent = `Повторное подключение (${reconnectAttempts}/${maxReconnectAttempts})...`;
                        initSocket();
                    }, 2000);
                }
            });
            
            socket.on('connect_error', (error) => {
                statusDiv.textContent = 'Ошибка подключения: ' + error.message;
            });
            
            socket.on('webrtc_offer', async (data) => {
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('webrtc_answer', {
                        answer: peerConnection.localDescription,
                        room_id: roomId,
                        target_sid: data.sender_sid
                    });
                    statusDiv.textContent = 'Отправлен ответ WebRTC';
                } catch (error) {
                    console.error('Ошибка обработки предложения:', error);
                    statusDiv.textContent = 'Ошибка WebRTC соединения';
                }
            });
            
            socket.on('webrtc_answer', async (data) => {
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    statusDiv.textContent = 'WebRTC соединение установлено';
                } catch (error) {
                    console.error('Ошибка обработки ответа:', error);
                    statusDiv.textContent = 'Ошибка WebRTC соединения';
                }
            });
            
            socket.on('webrtc_ice_candidate', async (data) => {
                try {
                    if (data.candidate) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                } catch (error) {
                    console.error('Ошибка добавления ICE кандидата:', error);
                }
            });
            
            socket.on('participants_update', (data) => {
                participantsDiv.textContent = `Участников: ${data.count}`;
            });
            
            socket.on('speech_text', (data) => {
                if (data.sid !== socket.id) {
                    showSpeechText(data.text, data.sid);
                }
            });
        }

        function initWebRTC() {
            peerConnection = new RTCPeerConnection(rtcConfiguration);
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc_ice_candidate', {
                        candidate: event.candidate,
                        room_id: roomId
                    });
                }
            };
            
            peerConnection.ontrack = (event) => {
                if (event.track.kind === 'video') {
                    teacherVideo.srcObject = event.streams[0];
                    teacherVideo.style.display = 'block';
                    noStreamMsg.style.display = 'none';
                    statusDiv.textContent = 'Получен видеопоток учителя';
                } else if (event.track.kind === 'audio') {
                    if (!teacherVideo.srcObject) {
                        teacherVideo.srcObject = new MediaStream();
                    }
                    teacherVideo.srcObject.addTrack(event.track);
                }
            };

            peerConnection.onconnectionstatechange = () => {
                switch (peerConnection.connectionState) {
                    case 'connected':
                        statusDiv.textContent = 'WebRTC соединение установлено';
                        break;
                    case 'disconnected':
                    case 'failed':
                        statusDiv.textContent = 'Ошибка соединения WebRTC';
                        break;
                }
            };
            
            dataChannel = peerConnection.createDataChannel('avatarData');
            dataChannel.onmessage = (event) => {
                console.log('Получены данные:', event.data);
            };
        }

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ru-RU';

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    if (finalTranscript) {
                        socket.emit('speech_text', {
                            text: finalTranscript,
                            room_id: roomId,
                            sid: socket.id
                        });
                        showSubtitles(finalTranscript);
                    } else if (interimTranscript) {
                        showSubtitles(interimTranscript);
                    }
                };

                recognition.onerror = (event) => {
                    console.error('Ошибка распознавания речи:', event.error);
                };

                recognition.onend = () => {
                    if (isMicOn) {
                        recognition.start();
                    }
                };
            } else {
                console.warn('Браузер не поддерживает распознавание речи');
            }
        }

        function showSubtitles(text) {
            subtitlesDiv.textContent = text;
            subtitlesDiv.style.display = 'block';
            
            clearTimeout(subtitlesDiv.timer);
            subtitlesDiv.timer = setTimeout(() => {
                subtitlesDiv.style.display = 'none';
            }, 3000);
        }

        function showSpeechText(text, source) {
            speechTextDiv.textContent = text;
            speechTextDiv.style.display = 'block';
            speechTextDiv.style.color = source === 'me' ? '#4CAF50' : '#3498db';
            
            setTimeout(() => {
                speechTextDiv.style.display = 'none';
            }, 5000);
        }

        async function toggleMicrophone() {
            try {
                if (!isMicOn) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = audioStream;
                    }
                    
                    if (peerConnection) {
                        userStream.getAudioTracks().forEach(track => {
                            peerConnection.addTrack(track, userStream);
                        });
                    }
                    
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Микрофон включен';
                    
                    if (recognition) {
                        recognition.start();
                    }
                } else {
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                    }
                    isMicOn = false;
                    micBtn.classList.remove('active');
                    micBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Микрофон выключен';
                    
                    if (recognition) {
                        recognition.stop();
                    }
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к микрофону: ' + error.message;
            }
        }

        async function toggleCamera() {
            try {
                if (!isCamOn) {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            frameRate: { ideal: 30 }
                        } 
                    });
                    
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = videoStream;
                    }
                    
                    if (peerConnection) {
                        userStream.getVideoTracks().forEach(track => {
                            peerConnection.addTrack(track, userStream);
                        });
                    }
                    
                    selfVideo.srcObject = userStream;
                    isCamOn = true;
                    camBtn.classList.add('active');
                    camBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Камера включена';
                    selfVideo.style.display = 'block';
                } else {
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => track.stop());
                        selfVideo.srcObject = null;
                    }
                    isCamOn = false;
                    camBtn.classList.remove('active');
                    camBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Камера выключена';
                    selfVideo.style.display = 'none';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к камере: ' + error.message;
            }
        }

        function toggleFullscreen() {
            if (!isFullscreen) {
                if (videoContainer.requestFullscreen) {
                    videoContainer.requestFullscreen();
                } else if (videoContainer.webkitRequestFullscreen) {
                    videoContainer.webkitRequestFullscreen();
                } else if (videoContainer.msRequestFullscreen) {
                    videoContainer.msRequestFullscreen();
                }
                isFullscreen = true;
                fullscreenBtn.querySelector('span').textContent = 'Обычный';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
                fullscreenBtn.querySelector('span').textContent = 'Полный';
            }
        }

        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (peerConnection) {
                peerConnection.close();
            }
            if (socket) {
                socket.emit('leave_room', { room_id: roomId });
                socket.disconnect();
            }
            
            if (isEmbedded) {
                window.parent.postMessage('conference_ended', '*');
            } else {
                window.location.href = '/';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (isEmbedded) {
                document.body.classList.add('embedded');
            }

            initSocket();
            
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            endCallBtn.addEventListener('click', endCall);

            selfVideo.style.display = 'none';
            teacherVideo.style.display = 'none';

            document.addEventListener('fullscreenchange', () => {
                isFullscreen = !!document.fullscreenElement;
                fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'Обычный' : 'Полный';
            });

            window.addEventListener('beforeunload', () => {
                endCall();
            });
        });
    </script>
</body>
</html>
