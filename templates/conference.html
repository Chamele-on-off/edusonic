<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеоконференция</title>
    <style>
        :root {
            --primary-color: #4285f4;
            --danger-color: #ea4335;
            --success-color: #34a853;
            --warning-color: #fbbc05;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #202124;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #teacher-video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            position: relative;
            overflow: hidden;
        }
        #teacher-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #user-video-container {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            overflow: hidden;
            background: black;
            z-index: 10;
        }
        #user-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: rotateY(180deg); /* Зеркальное отображение */
        }
        #controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(32, 33, 36, 0.8);
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 100;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #3c4043;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: #5f6368;
            transform: translateY(-3px);
        }
        .control-btn.active {
            background: var(--primary-color);
        }
        .control-btn.danger {
            background: var(--danger-color);
        }
        .control-btn.success {
            background: var(--success-color);
        }
        .control-btn.warning {
            background: var(--warning-color);
        }
        .control-btn i {
            pointer-events: none;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 10;
        }
        #room-name {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 10;
        }
        #audio-player {
            display: none;
        }
        .video-off-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #3c4043;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="main-container">
        <div id="teacher-video-container">
            <img id="teacher-video" src="" alt="Аватар учителя">
            <div id="status">Подключение к комнате...</div>
            <div id="room-name"></div>
        </div>
        
        <div id="user-video-container">
            <video id="user-video" autoplay playsinline></video>
            <div id="user-video-off" class="video-off-placeholder hidden">
                <i class="fas fa-video-slash"></i> Камера выключена
            </div>
        </div>
        
        <div id="controls">
            <button id="mute-btn" class="control-btn" title="Отключить звук">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="video-btn" class="control-btn" title="Отключить видео">
                <i class="fas fa-video"></i>
            </button>
            <button id="screen-btn" class="control-btn warning" title="Демонстрация экрана">
                <i class="fas fa-desktop"></i>
            </button>
            <button id="leave-btn" class="control-btn danger" title="Покинуть конференцию">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>
    
    <audio id="audio-player"></audio>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // Элементы
        const teacherVideo = document.getElementById('teacher-video');
        const userVideo = document.getElementById('user-video');
        const userVideoContainer = document.getElementById('user-video-container');
        const userVideoOff = document.getElementById('user-video-off');
        const muteBtn = document.getElementById('mute-btn');
        const videoBtn = document.getElementById('video-btn');
        const screenBtn = document.getElementById('screen-btn');
        const leaveBtn = document.getElementById('leave-btn');
        const statusDiv = document.getElementById('status');
        const roomNameSpan = document.getElementById('room-name');
        const audioPlayer = document.getElementById('audio-player');
        
        // Параметры URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'default';
        roomNameSpan.textContent = `Комната: ${roomName}`;
        
        // Socket.io
        const socket = io();
        
        // Состояние
        let userStream = null;
        let screenStream = null;
        let isMuted = false;
        let isVideoOff = false;
        let isSharingScreen = false;
        let teacherFrames = [];
        let currentTeacherFrame = 0;
        let animationInterval = null;
        
        // Подключение к комнате
        socket.emit('join_room', {
            room: roomName,
            is_teacher: false
        });
        
        // Обработчики событий Socket.io
        socket.on('room_joined', (data) => {
            statusDiv.textContent = 'Вы подключены к конференции';
            if (data.animation_state && data.animation_state.is_playing) {
                startAnimation(data.animation_state);
            }
        });
        
        socket.on('animation_state', (state) => {
            if (state.is_playing && state.frames && state.frames.length > 0) {
                startAnimation(state);
                statusDiv.textContent = `Анимация запущена: ${state.avatar_name}`;
            } else {
                if (animationInterval) {
                    clearInterval(animationInterval);
                    animationInterval = null;
                }
                statusDiv.textContent = 'Анимация остановлена';
            }
        });
        
        socket.on('frame_update', (data) => {
            teacherVideo.src = data.frame_url;
        });
        
        socket.on('audio_stream', (data) => {
            const audioSrc = `data:audio/mp3;base64,${data.audio}`;
            audioPlayer.src = audioSrc;
            audioPlayer.play().catch(e => console.log('Автовоспроизведение заблокировано', e));
        });
        
        // Запуск анимации
        function startAnimation(state) {
            teacherFrames = state.frames.map(frame => `/frames/${state.avatar_name}/${frame}`);
            currentTeacherFrame = state.current_frame;
            
            if (animationInterval) {
                clearInterval(animationInterval);
            }
            
            const fps = state.fps || 15;
            animationInterval = setInterval(() => {
                currentTeacherFrame = (currentTeacherFrame + 1) % teacherFrames.length;
                teacherVideo.src = teacherFrames[currentTeacherFrame];
            }, 1000 / fps);
        }
        
        // Управление камерой и микрофоном
        async function startCamera() {
            try {
                userStream = await navigator.mediaDevices.getUserMedia({ 
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: "user"
                    }, 
                    audio: true 
                });
                
                userVideo.srcObject = userStream;
                
                // Включаем микрофон по умолчанию
                toggleMute(); // Выключаем, чтобы потом включить и обновить состояние
                isMuted = true;
                toggleMute();
                
                // Отслеживаем отключение микрофона в потоке
                const audioTrack = userStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.onended = () => {
                        if (!isMuted) {
                            toggleMute();
                        }
                    };
                }
                
                // Отслеживаем отключение видео в потоке
                const videoTrack = userStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.onended = () => {
                        if (!isVideoOff) {
                            toggleVideo();
                        }
                    };
                }
                
                statusDiv.textContent = 'Камера и микрофон подключены';
                
            } catch (err) {
                console.error('Ошибка доступа к медиаустройствам:', err);
                statusDiv.textContent = 'Ошибка доступа к камере/микрофону: ' + err.message;
                
                // Пытаемся получить только аудио, если видео недоступно
                try {
                    userStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    isVideoOff = true;
                    userVideoOff.classList.remove('hidden');
                    videoBtn.innerHTML = '<i class="fas fa-video-slash"></i>';
                    videoBtn.classList.add('danger');
                    statusDiv.textContent = 'Подключен только микрофон (камера недоступна)';
                } catch (audioErr) {
                    console.error('Не удалось получить доступ к микрофону:', audioErr);
                }
            }
        }
        
        // Демонстрация экрана
        async function shareScreen() {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                // Заменяем видеопоток на экран
                const videoTrack = screenStream.getVideoTracks()[0];
                const sender = userStream.getVideoTracks()[0];
                if (sender) sender.replaceTrack(videoTrack);
                
                screenStream.getVideoTracks()[0].onended = () => {
                    if (isSharingScreen) {
                        toggleScreenShare();
                    }
                };
                
                isSharingScreen = true;
                screenBtn.classList.add('active');
                statusDiv.textContent = 'Демонстрация экрана включена';
            } catch (err) {
                console.error('Ошибка демонстрации экрана:', err);
                statusDiv.textContent = 'Ошибка демонстрации экрана: ' + err.message;
            }
        }
        
        // Остановка демонстрации экрана
        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
            }
            
            // Возвращаем камеру
            if (userStream && !isVideoOff) {
                navigator.mediaDevices.getUserMedia({ 
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: "user"
                    }
                }).then(stream => {
                    const videoTrack = stream.getVideoTracks()[0];
                    const sender = userStream.getVideoTracks()[0];
                    if (sender) sender.replaceTrack(videoTrack);
                    stream.getAudioTracks().forEach(track => track.stop());
                });
            }
            
            isSharingScreen = false;
            screenBtn.classList.remove('active');
            statusDiv.textContent = 'Демонстрация экрана отключена';
        }
        
        // Переключение микрофона
        function toggleMute() {
            if (!userStream) return;
            
            isMuted = !isMuted;
            userStream.getAudioTracks().forEach(track => {
                track.enabled = !isMuted;
            });
            
            // Отправляем состояние на сервер
            socket.emit('toggle_mute', {
                room: roomName,
                is_muted: isMuted
            });
            
            // Обновляем кнопку
            if (isMuted) {
                muteBtn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
                muteBtn.classList.add('danger');
                statusDiv.textContent = 'Микрофон отключен';
            } else {
                muteBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                muteBtn.classList.remove('danger');
                statusDiv.textContent = 'Микрофон включен';
            }
        }
        
        // Переключение видео
        function toggleVideo() {
            if (!userStream) return;
            
            isVideoOff = !isVideoOff;
            userStream.getVideoTracks().forEach(track => {
                track.enabled = !isVideoOff;
            });
            
            // Отправляем состояние на сервер
            socket.emit('toggle_video', {
                room: roomName,
                is_video_off: isVideoOff
            });
            
            // Показываем/скрываем плейсхолдер
            if (isVideoOff) {
                userVideoOff.classList.remove('hidden');
                videoBtn.innerHTML = '<i class="fas fa-video-slash"></i>';
                videoBtn.classList.add('danger');
                statusDiv.textContent = 'Камера отключена';
            } else {
                userVideoOff.classList.add('hidden');
                videoBtn.innerHTML = '<i class="fas fa-video"></i>';
                videoBtn.classList.remove('danger');
                statusDiv.textContent = 'Камера включена';
            }
        }
        
        // Переключение демонстрации экрана
        function toggleScreenShare() {
            if (isSharingScreen) {
                stopScreenShare();
            } else {
                shareScreen();
            }
        }
        
        // Покинуть конференцию
        function leaveConference() {
            // Останавливаем все потоки
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
            }
            
            // Отправляем событие на сервер
            socket.emit('leave_room', { room: roomName });
            
            // Перенаправляем на главную страницу
            window.location.href = '/';
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            // Запускаем камеру
            startCamera();
            
            // Назначаем обработчики кнопок
            muteBtn.addEventListener('click', toggleMute);
            videoBtn.addEventListener('click', toggleVideo);
            screenBtn.addEventListener('click', toggleScreenShare);
            leaveBtn.addEventListener('click', leaveConference);
        });
    </script>
</body>
</html>
