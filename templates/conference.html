<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференция</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1c1e22;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #2d3035;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404348;
        }
        #logo {
            font-weight: bold;
            font-size: 1.2rem;
        }
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        #video-container {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
            padding: 10px;
            gap: 10px;
        }
        .video-wrapper {
            position: relative;
            width: 300px;
            height: 225px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 12px;
        }
        #teacher-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #controls {
            background: #2d3035;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #404348;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #3d4046;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: #4e5158;
        }
        .control-btn i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        .control-btn span {
            font-size: 11px;
        }
        #fullscreen-btn {
            background: #4a4d54;
        }
        #end-call-btn {
            background: #e74c3c;
        }
        #end-call-btn:hover {
            background: #c0392b;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        .active {
            background: #4CAF50 !important;
        }
        #participants {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #room-info {
            position: absolute;
            top: 40px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        /* Иконки (можно заменить на реальные) */
        .icon {
            font-family: Arial, sans-serif;
            text-align: center;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="logo">Virtual Classroom</div>
        <div id="meeting-id">Конференция</div>
    </div>

    <div id="main">
        <div id="video-container">
            <!-- Динамически добавляемые видео элементы будут здесь -->
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <div class="icon">🎤</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <div class="icon">📷</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="screen-btn" title="Демонстрация экрана" disabled>
            <div class="icon">🖥️</div>
            <span>Экран</span>
        </button>
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <div class="icon">⛶</div>
            <span>Полный</span>
        </button>
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <div class="icon">📞</div>
            <span>Выйти</span>
        </button>
    </div>

    <audio id="speech-audio"></audio>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // Получаем ID комнаты из URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        document.getElementById('room-info').textContent = `Комната: ${roomId}`;
        
        // Элементы
        const videoContainer = document.getElementById('video-container');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const screenBtn = document.getElementById('screen-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const participantsDiv = document.getElementById('participants');
        const speechAudio = document.getElementById('speech-audio');
        const mainElement = document.getElementById('main');

        // Состояние
        let userStream = null;
        let socket = null;
        let isMicOn = false;
        let isCamOn = false;
        let isFullscreen = false;
        let peerConnections = {};
        let localVideoElement = null;
        let localStream = null;

        // Создание видео элемента для участника
        function createVideoElement(socketId, isLocal = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';
            wrapper.id = `video-${socketId}`;
            
            const video = document.createElement(isLocal ? 'video' : 'img');
            video.className = 'video-element';
            video.autoplay = true;
            video.muted = isLocal;
            
            const label = document.createElement('div');
            label.className = 'video-label';
            label.textContent = isLocal ? 'Вы' : `Участник ${socketId.substring(0, 5)}`;
            
            wrapper.appendChild(video);
            wrapper.appendChild(label);
            videoContainer.appendChild(wrapper);
            
            return video;
        }

        // Удаление видео элемента участника
        function removeVideoElement(socketId) {
            const element = document.getElementById(`video-${socketId}`);
            if (element) {
                element.remove();
            }
        }

        // Инициализация Socket.io
        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                statusDiv.textContent = 'Подключено к серверу';
                // Присоединяемся к комнате
                socket.emit('join_room', { room_id: roomId });
                
                // Создаем видео элемент для себя
                localVideoElement = createVideoElement(socket.id, true);
            });
            
            socket.on('disconnect', () => {
                statusDiv.textContent = 'Отключено от сервера';
            });
            
            socket.on('animation_frame', (data) => {
                // Ищем видео элемент учителя (можно добавить специальный ID для учителя)
                const teacherVideo = document.querySelector('.video-element[data-teacher="true"]');
                if (teacherVideo) {
                    teacherVideo.src = data.frame;
                }
                statusDiv.textContent = `Анимация учителя: кадр ${data.index + 1}/${data.total}`;
            });
            
            socket.on('speech_audio', (data) => {
                const audioSrc = `data:audio/mp3;base64,${data.audio}`;
                speechAudio.src = audioSrc;
                speechAudio.play().catch(e => console.log('Автовоспроизведение заблокировано', e));
            });
            
            socket.on('participants_update', (data) => {
                participantsDiv.textContent = `Участников: ${data.count}`;
            });
            
            socket.on('remote_stream', (data) => {
                // Получаем видео от другого участника
                let videoElement = document.querySelector(`#video-${data.socket_id} .video-element`);
                if (!videoElement) {
                    videoElement = createVideoElement(data.socket_id);
                }
                videoElement.src = data.video_data;
            });
        }

        // Управление микрофоном
        async function toggleMicrophone() {
            try {
                if (!isMicOn) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = audioStream;
                    }
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Микрофон включен';
                } else {
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                    }
                    isMicOn = false;
                    micBtn.classList.remove('active');
                    micBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Микрофон выключен';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к микрофону: ' + error.message;
            }
        }

        // Управление камерой
        async function toggleCamera() {
            try {
                if (!isCamOn) {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = videoStream;
                    }
                    
                    if (localVideoElement) {
                        localVideoElement.srcObject = userStream;
                    }
                    
                    isCamOn = true;
                    camBtn.classList.add('active');
                    camBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Камера включена';
                } else {
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => track.stop());
                        if (localVideoElement) {
                            localVideoElement.srcObject = null;
                        }
                    }
                    isCamOn = false;
                    camBtn.classList.remove('active');
                    camBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Камера выключена';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к камере: ' + error.message;
            }
        }

        // Полноэкранный режим
        function toggleFullscreen() {
            if (!isFullscreen) {
                if (mainElement.requestFullscreen) {
                    mainElement.requestFullscreen();
                } else if (mainElement.webkitRequestFullscreen) {
                    mainElement.webkitRequestFullscreen();
                } else if (mainElement.msRequestFullscreen) {
                    mainElement.msRequestFullscreen();
                }
                isFullscreen = true;
                fullscreenBtn.querySelector('span').textContent = 'Обычный';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
                fullscreenBtn.querySelector('span').textContent = 'Полный';
            }
        }

        // Завершение вызова
        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (socket) {
                socket.emit('leave_room', { room_id: roomId });
                socket.disconnect();
            }
            window.location.href = '/';
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            
            // Обработчики кнопок
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            endCallBtn.addEventListener('click', endCall);

            // Обработчик изменения размера окна
            window.addEventListener('resize', () => {
                // Можно добавить адаптацию интерфейса при изменении размера
            });
        });

        // Обработчик выхода из полноэкранного режима
        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'Обычный' : 'Полный';
        });
    </script>
</body>
</html>
