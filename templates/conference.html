<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференция</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1c1e22;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #2d3035;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404348;
        }
        #logo {
            font-weight: bold;
            font-size: 1.2rem;
        }
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        #video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        #teacher-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #self-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 20%;
            max-width: 300px;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #controls {
            background: #2d3035;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #404348;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #3d4046;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: #4e5158;
        }
        .control-btn i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        .control-btn span {
            font-size: 11px;
        }
        #fullscreen-btn {
            background: #4a4d54;
        }
        #end-call-btn {
            background: #e74c3c;
        }
        #end-call-btn:hover {
            background: #c0392b;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        .active {
            background: #4CAF50 !important;
        }
        #participants {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #room-info {
            position: absolute;
            top: 40px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #speech-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 4px;
            max-width: 80%;
            text-align: center;
            display: none;
        }
        body.embedded {
            height: auto;
        }
        body.embedded #header {
            display: none;
        }
        body.embedded #controls {
            padding: 5px;
        }
        body.embedded .control-btn {
            width: 40px;
            height: 40px;
            font-size: 12px;
        }
    </style>
</head>
<body class="{{ 'embedded' if embed else '' }}">
    {% if not embed %}
    <div id="header">
        <div id="logo">Virtual Classroom</div>
        <div id="meeting-id">Конференция</div>
    </div>
    {% endif %}

    <div id="main">
        <div id="video-container">
            <video id="teacher-video" autoplay playsinline></video>
            <video id="self-video" autoplay muted playsinline></video>
            
            <div id="status">Подключение к конференции...</div>
            <div id="room-info">Комната: <span id="room-name">default</span></div>
            <div id="participants">Участников: 1</div>
            <div id="speech-text"></div>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <div class="icon">🎤</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <div class="icon">📷</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="screen-btn" title="Демонстрация экрана" disabled>
            <div class="icon">🖥️</div>
            <span>Экран</span>
        </button>
        {% if not embed %}
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <div class="icon">⛶</div>
            <span>Полный</span>
        </button>
        {% endif %}
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <div class="icon">📞</div>
            <span>Выйти</span>
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const isEmbedded = window.location.search.includes('embed=true');
        document.getElementById('room-name').textContent = roomId;
        
        const teacherVideo = document.getElementById('teacher-video');
        const selfVideo = document.getElementById('self-video');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const screenBtn = document.getElementById('screen-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const participantsDiv = document.getElementById('participants');
        const speechTextDiv = document.getElementById('speech-text');
        const videoContainer = document.getElementById('video-container');
        const mainElement = document.getElementById('main');

        let userStream = null;
        let socket = null;
        let isMicOn = false;
        let isCamOn = false;
        let isFullscreen = false;
        let recognition = null;
        let speechHistory = [];
        let peerConnection = null;
        let dataChannel = null;

        // Конфигурация WebRTC (STUN серверы)
        const rtcConfiguration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                statusDiv.textContent = 'Подключено к серверу';
                socket.emit('join_room', { room_id: roomId });
                
                // Инициализируем WebRTC соединение
                initWebRTC();
                
                setTimeout(() => {
                    toggleMicrophone();
                    toggleCamera();
                }, 500);
            });
            
            socket.on('disconnect', () => {
                statusDiv.textContent = 'Отключено от сервера';
            });
            
            socket.on('offer', async (offer) => {
                statusDiv.textContent = 'Получено предложение WebRTC';
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('answer', { answer, room_id: roomId });
                    statusDiv.textContent = 'Отправлен ответ WebRTC';
                } catch (error) {
                    console.error('Ошибка обработки предложения:', error);
                    statusDiv.textContent = 'Ошибка WebRTC соединения';
                }
            });
            
            socket.on('answer', async (answer) => {
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    statusDiv.textContent = 'WebRTC соединение установлено';
                } catch (error) {
                    console.error('Ошибка обработки ответа:', error);
                    statusDiv.textContent = 'Ошибка WebRTC соединения';
                }
            });
            
            socket.on('ice-candidate', async (candidate) => {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (error) {
                    console.error('Ошибка добавления ICE кандидата:', error);
                }
            });
            
            socket.on('participants_update', (data) => {
                participantsDiv.textContent = `Участников: ${data.count}`;
            });
            
            socket.on('speech_text', (data) => {
                if (data.sid !== socket.id) {
                    showSpeechText(data.text, data.sid);
                }
            });
        }

        function initWebRTC() {
            peerConnection = new RTCPeerConnection(rtcConfiguration);
            
            // Обработка ICE кандидатов
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { 
                        candidate: event.candidate,
                        room_id: roomId 
                    });
                }
            };
            
            // Получение удаленного потока
            peerConnection.ontrack = (event) => {
                if (event.track.kind === 'video') {
                    teacherVideo.srcObject = event.streams[0];
                    statusDiv.textContent = 'Получен видеопоток учителя';
                }
            };
            
            // Создаем предложение для установки соединения
            createOffer();
        }

        async function createOffer() {
            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { 
                    offer: peerConnection.localDescription,
                    room_id: roomId 
                });
                statusDiv.textContent = 'Отправлено предложение WebRTC';
            } catch (error) {
                console.error('Ошибка создания предложения:', error);
                statusDiv.textContent = 'Ошибка инициализации WebRTC';
            }
        }

        function showSpeechText(text, source) {
            speechTextDiv.textContent = text;
            speechTextDiv.style.display = 'block';
            speechTextDiv.style.color = source === 'me' ? '#4CAF50' : '#3498db';
            
            setTimeout(() => {
                speechTextDiv.style.display = 'none';
            }, 5000);
        }

        async function toggleMicrophone() {
            try {
                if (!isMicOn) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = audioStream;
                    }
                    
                    // Добавляем аудиопоток в WebRTC соединение
                    if (peerConnection) {
                        userStream.getAudioTracks().forEach(track => {
                            peerConnection.addTrack(track, userStream);
                        });
                    }
                    
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Микрофон включен';
                    
                    if (recognition) {
                        recognition.start();
                    } else {
                        initSpeechRecognition();
                        if (recognition) recognition.start();
                    }
                } else {
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                    }
                    isMicOn = false;
                    micBtn.classList.remove('active');
                    micBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Микрофон выключен';
                    
                    if (recognition) {
                        recognition.stop();
                    }
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к микрофону: ' + error.message;
            }
        }

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ru-RU';

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        socket.emit('recognized_speech', {
                            room_id: roomId,
                            text: finalTranscript
                        });
                        showSpeechText(finalTranscript, 'me');
                    }
                };

                recognition.onerror = (event) => {
                    console.error('Ошибка распознавания речи:', event.error);
                };
            }
        }

        async function toggleCamera() {
            try {
                if (!isCamOn) {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = videoStream;
                    }
                    
                    // Добавляем видеопоток в WebRTC соединение
                    if (peerConnection) {
                        userStream.getVideoTracks().forEach(track => {
                            peerConnection.addTrack(track, userStream);
                        });
                    }
                    
                    selfVideo.srcObject = userStream;
                    isCamOn = true;
                    camBtn.classList.add('active');
                    camBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Камера включена';
                    selfVideo.style.display = 'block';
                } else {
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => track.stop());
                        selfVideo.srcObject = null;
                    }
                    isCamOn = false;
                    camBtn.classList.remove('active');
                    camBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Камера выключена';
                    selfVideo.style.display = 'none';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к камере: ' + error.message;
            }
        }

        function toggleFullscreen() {
            if (!isFullscreen) {
                if (mainElement.requestFullscreen) {
                    mainElement.requestFullscreen();
                } else if (mainElement.webkitRequestFullscreen) {
                    mainElement.webkitRequestFullscreen();
                } else if (mainElement.msRequestFullscreen) {
                    mainElement.msRequestFullscreen();
                }
                isFullscreen = true;
                if (fullscreenBtn) fullscreenBtn.querySelector('span').textContent = 'Обычный';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
                if (fullscreenBtn) fullscreenBtn.querySelector('span').textContent = 'Полный';
            }
        }

        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (recognition) {
                recognition.stop();
            }
            if (peerConnection) {
                peerConnection.close();
            }
            if (socket) {
                socket.emit('leave_room', { room_id: roomId });
                socket.disconnect();
            }
            
            if (isEmbedded) {
                window.parent.postMessage('conference_ended', '*');
            } else {
                window.location.href = '/';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', toggleFullscreen);
            }
            endCallBtn.addEventListener('click', endCall);

            selfVideo.style.display = 'none';

            if (isEmbedded) {
                document.body.classList.add('embedded');
            }

            window.addEventListener('message', (event) => {
                if (event.data === 'end_conference') {
                    endCall();
                }
            });
        });

        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            if (fullscreenBtn) {
                fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'Обычный' : 'Полный';
            }
        });
    </script>
</body>
</html>
