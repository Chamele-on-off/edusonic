<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференция</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1c1e22;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #2d3035;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404348;
        }
        #logo {
            font-weight: bold;
            font-size: 1.2rem;
        }
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        #video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        #teacher-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #self-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 20%;
            max-width: 300px;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #controls {
            background: #2d3035;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #404348;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #3d4046;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: #4e5158;
        }
        .control-btn i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        .control-btn span {
            font-size: 11px;
        }
        #fullscreen-btn {
            background: #4a4d54;
        }
        #end-call-btn {
            background: #e74c3c;
        }
        #end-call-btn:hover {
            background: #c0392b;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        .active {
            background: #4CAF50 !important;
        }
        #participants {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #room-info {
            position: absolute;
            top: 40px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
        #speech-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 4px;
            max-width: 80%;
            text-align: center;
            display: none;
        }
        .icon {
            font-family: Arial, sans-serif;
            text-align: center;
            line-height: 1;
        }
        body.embedded {
            height: auto;
        }
        body.embedded #header {
            display: none;
        }
        body.embedded #controls {
            padding: 5px;
        }
        body.embedded .control-btn {
            width: 40px;
            height: 40px;
            font-size: 12px;
        }
    </style>
</head>
<body class="{{ 'embedded' if embed else '' }}">
    {% if not embed %}
    <div id="header">
        <div id="logo">Virtual Classroom</div>
        <div id="meeting-id">Конференция</div>
    </div>
    {% endif %}

    <div id="main">
        <div id="video-container">
            <img id="teacher-video" src="" alt="Анимация учителя">
            <video id="self-video" autoplay muted></video>
            
            <div id="status">Подключение к конференции...</div>
            <div id="room-info">Комната: <span id="room-name">default</span></div>
            <div id="participants">Участников: <span id="participants-count">1</span></div>
            <div id="speech-text"></div>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <div class="icon">🎤</div>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <div class="icon">📷</div>
            <span>Вкл</span>
        </button>
        {% if not embed %}
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <div class="icon">⛶</div>
            <span>Полный</span>
        </button>
        {% endif %}
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <div class="icon">📞</div>
            <span>Выйти</span>
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // Получаем ID комнаты из URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const isEmbedded = window.location.search.includes('embed=true');
        document.getElementById('room-name').textContent = roomId;
        
        // Элементы
        const teacherVideo = document.getElementById('teacher-video');
        const selfVideo = document.getElementById('self-video');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const participantsCount = document.getElementById('participants-count');
        const speechTextDiv = document.getElementById('speech-text');
        
        // Состояние
        let userStream = null;
        let socket = null;
        let isMicOn = false;
        let isCamOn = false;
        let recognition = null;
        let currentPhoneme = 'neutral';
        let speechSynthesis = window.speechSynthesis || null;
        let voices = [];
        let maleVoice = null;

        // Инициализация медиаустройств
        async function initMedia() {
            try {
                userStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 44100
                    },
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });
                
                selfVideo.srcObject = userStream;
                isCamOn = true;
                camBtn.classList.add('active');
                camBtn.querySelector('span').textContent = 'Выкл';
                
                isMicOn = true;
                micBtn.classList.add('active');
                micBtn.querySelector('span').textContent = 'Выкл';
                
                statusDiv.textContent = 'Камера и микрофон включены';
                selfVideo.style.display = 'block';
                
                initSpeechRecognition();
                initVoices();
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к устройствам: ' + error.message;
                console.error('Media init error:', error);
            }
        }

        // Инициализация голосов
        function initVoices() {
            if (!speechSynthesis) return;
            
            voices = speechSynthesis.getVoices();
            maleVoice = voices.find(voice => 
                voice.lang.includes('ru') && 
                (voice.name.toLowerCase().includes('male') || 
                 voice.name.toLowerCase().includes('муж') ||
                 voice.name.toLowerCase().includes('yandex') ||
                 voice.name.toLowerCase().includes('alex'))
            );
            
            if (!maleVoice) {
                maleVoice = voices.find(voice => voice.lang.includes('ru'));
            }
        }

        // Инициализация распознавания речи
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ru-RU';
                
                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    
                    if (finalTranscript) {
                        socket.emit('recognized_speech', {
                            room_id: roomId,
                            text: finalTranscript
                        });
                        showSpeechText(finalTranscript, 'me');
                    }
                };
                
                recognition.start();
                recognition.onend = () => recognition.start();
            }
        }

        // Показать текст речи
        function showSpeechText(text, source) {
            speechTextDiv.textContent = text;
            speechTextDiv.style.display = 'block';
            speechTextDiv.style.color = source === 'me' ? '#4CAF50' : '#3498db';
            
            setTimeout(() => {
                speechTextDiv.style.display = 'none';
            }, 5000);
        }

        // Озвучивание текста
        function speakText(text) {
            if (!speechSynthesis || !maleVoice) return;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = maleVoice;
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 0.8;
            
            // Анализ фонем для анимации губ
            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const word = text.substring(event.charIndex, event.charIndex + event.charLength);
                    analyzePhonemes(word);
                }
            };
            
            speechSynthesis.speak(utterance);
        }

        // Анализ фонем в слове
        function analyzePhonemes(word) {
            const vowels = {
                'а': 'aa', 'е': 'ee', 'ё': 'oo', 'и': 'ih', 
                'о': 'oh', 'у': 'uu', 'ы': 'ih', 'э': 'eh', 
                'ю': 'yu', 'я': 'ya'
            };
            
            for (let i = 0; i < word.length; i++) {
                const char = word[i].toLowerCase();
                if (vowels[char]) {
                    currentPhoneme = vowels[char];
                    setTimeout(() => {
                        currentPhoneme = 'neutral';
                    }, 200);
                }
            }
        }

        // Инициализация Socket.io
        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                statusDiv.textContent = 'Подключено к серверу';
                socket.emit('join_room', { room_id: roomId });
            });
            
            socket.on('animation_frame', (data) => {
                teacherVideo.src = data.frame;
                currentPhoneme = data.phoneme || 'neutral';
            });
            
            socket.on('speech_text', (data) => {
                if (data.type === 'avatar') {
                    speakText(data.text);
                    showSpeechText(data.text, 'teacher');
                } else if (data.type === 'human') {
                    showSpeechText(data.text, data.sid);
                }
            });
            
            socket.on('participants_update', (data) => {
                participantsCount.textContent = data.count;
            });
            
            socket.on('update_phoneme', (data) => {
                currentPhoneme = data.phoneme;
            });
        }

        // Переключение микрофона
        function toggleMicrophone() {
            if (userStream) {
                const audioTracks = userStream.getAudioTracks();
                if (audioTracks.length > 0) {
                    isMicOn = !audioTracks[0].enabled;
                    audioTracks[0].enabled = isMicOn;
                    micBtn.classList.toggle('active', isMicOn);
                    micBtn.querySelector('span').textContent = isMicOn ? 'Выкл' : 'Вкл';
                    
                    if (isMicOn && recognition) {
                        recognition.start();
                    } else if (recognition) {
                        recognition.stop();
                    }
                }
            }
        }

        // Переключение камеры
        function toggleCamera() {
            if (userStream) {
                const videoTracks = userStream.getVideoTracks();
                if (videoTracks.length > 0) {
                    isCamOn = !videoTracks[0].enabled;
                    videoTracks[0].enabled = isCamOn;
                    camBtn.classList.toggle('active', isCamOn);
                    camBtn.querySelector('span').textContent = isCamOn ? 'Выкл' : 'Вкл';
                    selfVideo.style.display = isCamOn ? 'block' : 'none';
                }
            }
        }

        // Полноэкранный режим
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Завершение вызова
        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (recognition) {
                recognition.stop();
            }
            if (socket) {
                socket.disconnect();
            }
            
            if (isEmbedded) {
                window.parent.postMessage('conference_ended', '*');
            } else {
                window.location.href = '/';
            }
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            initMedia();
            
            // Обработчики кнопок
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            if (fullscreenBtn) fullscreenBtn.addEventListener('click', toggleFullscreen);
            endCallBtn.addEventListener('click', endCall);
            
            // Обработчик изменения голосов
            if (speechSynthesis) {
                speechSynthesis.onvoiceschanged = initVoices;
            }
        });

        // Обработчик выхода из полноэкранного режима
        document.addEventListener('fullscreenchange', () => {
            if (fullscreenBtn) {
                fullscreenBtn.querySelector('span').textContent = 
                    document.fullscreenElement ? 'Обычный' : 'Полный';
            }
        });
    </script>
</body>
</html>
