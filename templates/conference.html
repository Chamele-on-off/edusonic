<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальный класс</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --danger: #f72585;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
            --teacher-color: #4cc9f0;
            --student-color: #f72585;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        #header {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        #logo {
            font-weight: bold;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        
        #video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .animated-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
        }
        
        #lesson-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            max-width: 85%;
            max-height: 75%;
            overflow: hidden;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 5;
            display: none;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-overflow-scrolling: touch;
        }
        
        #lesson-content h2 {
            margin-bottom: 25px;
            color: var(--teacher-color);
            text-align: center;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        #lesson-text {
            font-size: 1.4rem;
            line-height: 1.7;
            text-align: center;
            font-weight: 350;
            color: rgba(255, 255, 255, 0.95);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        #lesson-text::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--teacher-color), transparent);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.4rem;
            background: var(--teacher-color);
            margin-left: 2px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        #teacher-video-container {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 220px;
            height: 165px;
            border: 3px solid var(--teacher-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(76, 201, 240, 0.3);
            z-index: 10;
            background: black;
        }
        
        #teacher-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #teacher-speech {
            position: absolute;
            bottom: calc(100% + 10px);
            right: 0;
            background: linear-gradient(135deg, var(--teacher-color), #3a86ff);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            max-width: 250px;
            font-size: 14px;
            z-index: 11;
            display: none;
            box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #self-video-container {
            position: absolute;
            bottom: 100px;
            left: 20px;
            width: 220px;
            height: 165px;
            border: 3px solid var(--student-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(247, 37, 133, 0.3);
            z-index: 10;
            background: black;
        }
        
        #self-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #student-speech {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 0;
            background: linear-gradient(135deg, var(--student-color), #ff6b6b);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            max-width: 250px;
            font-size: 14px;
            z-index: 11;
            display: none;
            box-shadow: 0 5px 15px rgba(247, 37, 133, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #status-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 10;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 80%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #participants {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        #controls {
            background: rgba(0, 0, 0, 0.7);
            padding: 18px;
            display: flex;
            justify-content: center;
            gap: 18px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 22px;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        
        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .control-btn:active::before {
            opacity: 1;
        }
        
        .control-btn:active {
            transform: scale(0.92);
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        .control-btn.active {
            background: var(--primary);
            box-shadow: 0 0 20px rgba(67, 97, 238, 0.4);
        }
        
        .control-btn span {
            font-size: 12px;
            margin-top: 5px;
            font-weight: 500;
        }
        
        #end-call-btn {
            background: var(--danger);
        }
        
        #end-call-btn:active {
            background: #e01b74;
            transform: scale(0.92);
        }
        
        #audio-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #audio-play-btn {
            padding: 22px 44px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-user-select: none;
            user-select: none;
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.3);
        }
        
        #audio-play-btn:active {
            transform: scale(0.95);
        }
        
        #activate-ai-btn {
            position: absolute;
            bottom: 280px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.3);
            transition: all 0.3s ease;
            display: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #activate-ai-btn:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        #manual-speech-input {
            position: absolute;
            bottom: 350px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 10;
            display: none;
            flex-direction: column;
            gap: 12px;
            min-width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #manual-speech-input input {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #manual-speech-input input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        #manual-speech-input button {
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
        }
        
        #manual-speech-btn {
            position: absolute;
            bottom: 350px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
            display: none;
            -webkit-user-select: none;
            user-select: none;
            box-shadow: 0 5px 15px rgba(76, 201, 240, 0.3);
        }
        
        #manual-speech-btn:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        .camera-permission {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 20;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .camera-permission p {
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .camera-permission button {
            padding: 14px 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            #header {
                padding: 10px 15px;
            }
            
            #logo {
                font-size: 1.1rem;
            }
            
            #teacher-video-container,
            #self-video-container {
                width: 160px;
                height: 120px;
                bottom: 90px;
            }
            
            #teacher-speech,
            #student-speech {
                max-width: 200px;
                font-size: 13px;
                padding: 10px 16px;
            }
            
            #controls {
                padding: 12px;
                gap: 12px;
            }
            
            .control-btn {
                width: 55px;
                height: 55px;
                font-size: 20px;
            }
            
            .control-btn span {
                font-size: 11px;
            }
            
            #activate-ai-btn {
                bottom: 230px;
                padding: 14px 28px;
                font-size: 16px;
            }
            
            #manual-speech-btn {
                bottom: 290px;
                padding: 12px 24px;
                font-size: 14px;
            }
            
            #manual-speech-input {
                bottom: 290px;
                min-width: 280px;
                padding: 16px;
            }
            
            #lesson-content {
                padding: 30px;
                max-width: 90%;
            }
            
            #lesson-content h2 {
                font-size: 1.5rem;
            }
            
            #lesson-text {
                font-size: 1.2rem;
                min-height: 100px;
                padding: 16px;
            }
        }
        
        @media (max-width: 480px) {
            #teacher-video-container,
            #self-video-container {
                width: 140px;
                height: 105px;
                bottom: 80px;
            }
            
            #teacher-speech,
            #student-speech {
                max-width: 180px;
                font-size: 12px;
                padding: 8px 14px;
                bottom: calc(100% + 8px);
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }
            
            #status-container {
                font-size: 12px;
                padding: 10px 14px;
                max-width: 75%;
            }
            
            #activate-ai-btn {
                bottom: 210px;
                padding: 12px 24px;
                font-size: 14px;
            }
            
            #manual-speech-btn {
                bottom: 260px;
                padding: 10px 20px;
                font-size: 13px;
            }
            
            #manual-speech-input {
                bottom: 260px;
                min-width: 250px;
                padding: 14px;
            }
            
            #manual-speech-input input {
                padding: 12px;
                font-size: 14px;
            }
            
            #manual-speech-input button {
                padding: 12px;
                font-size: 14px;
            }
            
            #lesson-content {
                padding: 20px;
            }
            
            #lesson-content h2 {
                font-size: 1.3rem;
                margin-bottom: 20px;
            }
            
            #lesson-text {
                font-size: 1.1rem;
                min-height: 90px;
                padding: 14px;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(30px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        .slide-out {
            animation: slideOut 0.5s ease forwards;
        }
        
        @keyframes slideOut {
            from { 
                opacity: 1; 
                transform: translateY(0) scale(1);
            }
            to { 
                opacity: 0; 
                transform: translateY(-30px) scale(0.95);
            }
        }
        
        .typewriter {
            overflow: hidden;
            white-space: nowrap;
            animation: typing 3s steps(40, end);
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        body.embedded {
            height: auto;
        }
        
        body.embedded #header {
            display: none;
        }
        
        body.embedded #controls {
            padding: 10px;
        }
        
        body.embedded .control-btn {
            width: 50px;
            height: 50px;
            font-size: 16px;
        }
        
        /* iOS specific fixes */
        @supports (-webkit-touch-callout: none) {
            body {
                height: -webkit-fill-available;
            }
            
            #main {
                height: -webkit-fill-available;
            }
            
            .control-btn {
                cursor: default;
            }
        }
    </style>
</head>
<body>
    <div id="header" class="fade-in">
        <div id="logo">
            <i class="fas fa-chalkboard-teacher"></i>
            <span>Виртуальный класс</span>
        </div>
        <div id="meeting-id">Комната: <span id="room-name">default</span></div>
    </div>

    <div id="main">
        <div id="video-container">
            <div id="background-animation"></div>
            
            <div id="lesson-content">
                <h2 id="lesson-title"></h2>
                <div id="lesson-text"></div>
            </div>
            
            <div id="teacher-video-container" class="fade-in">
                <img id="teacher-video" src="" alt="Аватар учителя">
                <div id="teacher-speech"></div>
            </div>
            
            <div id="self-video-container" class="fade-in">
                <video id="self-video" autoplay muted playsinline></video>
                <div id="student-speech"></div>
            </div>
            
            <div id="status-container" class="fade-in">
                <div id="status">Подключение к конференции...</div>
                <div id="participants">
                    <i class="fas fa-users"></i>
                    <span id="participants-count">1</span> участников
                </div>
            </div>
            
            <button id="activate-ai-btn" class="fade-in">Activate AI-Teacher</button>
            
            <button id="manual-speech-btn" class="fade-in">
                <i class="fas fa-keyboard"></i> Ввести текст
            </button>
            
            <div id="manual-speech-input" class="fade-in">
                <input type="text" id="speech-input-text" placeholder="Введите ваше сообщение...">
                <button id="send-speech-btn">Отправить</button>
            </div>
            
            <div id="audio-overlay">
                <button id="audio-play-btn">
                    <i class="fas fa-volume-up"></i> Нажмите для воспроизведения
                </button>
            </div>
            
            <div class="camera-permission fade-in" id="camera-permission">
                <p>Разрешите доступ к камере и микрофону для участия в конференции</p>
                <button id="enable-camera-btn">Разрешить доступ</button>
            </div>
        </div>
    </div>

    <div id="controls" class="fade-in">
        <button class="control-btn" id="mic-btn" title="Микрофон">
            <i class="fas fa-microphone"></i>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="cam-btn" title="Камера">
            <i class="fas fa-video"></i>
            <span>Вкл</span>
        </button>
        <button class="control-btn" id="screen-btn" title="Демонстрация экрана" disabled>
            <i class="fas fa-desktop"></i>
            <span>Экран</span>
        </button>
        <button class="control-btn" id="fullscreen-btn" title="Полный экран">
            <i class="fas fa-expand"></i>
            <span>Полный</span>
        </button>
        <button class="control-btn" id="end-call-btn" title="Выйти">
            <i class="fas fa-phone-slash"></i>
            <span>Выйти</span>
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const isEmbedded = window.location.search.includes('embed=true');
        document.getElementById('room-name').textContent = roomId;
        
        const teacherVideo = document.getElementById('teacher-video');
        const selfVideo = document.getElementById('self-video');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const screenBtn = document.getElementById('screen-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const statusDiv = document.getElementById('status');
        const participantsCount = document.getElementById('participants-count');
        const teacherSpeech = document.getElementById('teacher-speech');
        const studentSpeech = document.getElementById('student-speech');
        const audioOverlay = document.getElementById('audio-overlay');
        const audioPlayBtn = document.getElementById('audio-play-btn');
        const activateAiBtn = document.getElementById('activate-ai-btn');
        const lessonContent = document.getElementById('lesson-content');
        const lessonTitle = document.getElementById('lesson-title');
        const lessonText = document.getElementById('lesson-text');
        const backgroundAnimation = document.getElementById('background-animation');
        const manualSpeechBtn = document.getElementById('manual-speech-btn');
        const manualSpeechInput = document.getElementById('manual-speech-input');
        const speechInputText = document.getElementById('speech-input-text');
        const sendSpeechBtn = document.getElementById('send-speech-btn');
        const cameraPermission = document.getElementById('camera-permission');
        const enableCameraBtn = document.getElementById('enable-camera-btn');

        let userStream = null;
        let socket = null;
        let isMicOn = false;
        let isCamOn = false;
        let isFullscreen = false;
        let recognition = null;
        let speechHistory = [];
        let pendingAudio = null;
        let aiTeacherActivated = false;
        let animationCircles = [];
        let currentLesson = null;
        let currentParagraph = 0;
        let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        let currentTypingAnimation = null;
        let currentLessonContent = [];

        function createBackgroundAnimation() {
            for (let i = 0; i < 8; i++) {
                const circle = document.createElement('div');
                circle.className = 'animated-circle';
                
                const size = Math.random() * 80 + 40;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                circle.style.left = `${Math.random() * 100}%`;
                circle.style.top = `${Math.random() * 100}%`;
                
                const colors = ['#4361ee', '#3a0ca3', '#4cc9f0', '#f72585'];
                circle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                backgroundAnimation.appendChild(circle);
                animationCircles.push(circle);
                
                anime({
                    targets: circle,
                    translateX: () => anime.random(-200, 200),
                    translateY: () => anime.random(-200, 200),
                    scale: () => anime.random(0.5, 1.2),
                    duration: () => anime.random(4000, 12000),
                    easing: 'easeInOutQuad',
                    complete: function(anim) {
                        anim.restart();
                    }
                });
            }
        }

        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                statusDiv.textContent = 'Подключено к серверу';
                socket.emit('join_room', { room_id: roomId });
                
                // Автоматически включаем камеру и микрофон
                setTimeout(() => {
                    enableCameraAndMicrophone();
                }, 1000);
                
                // Для iOS показываем кнопку ручного ввода
                if (isIOS) {
                    manualSpeechBtn.style.display = 'block';
                }
            });
            
            socket.on('disconnect', () => {
                statusDiv.textContent = 'Отключено от сервера';
            });
            
            socket.on('animation_frame', (data) => {
                teacherVideo.src = data.frame;
            });
            
            socket.on('speech_audio', (data) => {
                try {
                    const audio = new Audio(`data:audio/mp3;base64,${data.audio}`);
                    
                    const playPromise = audio.play();
                    
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                showTeacherSpeech(data.text);
                                audioOverlay.style.display = 'none';
                            })
                            .catch(error => {
                                pendingAudio = audio;
                                audioOverlay.style.display = 'flex';
                                showTeacherSpeech(data.text);
                                statusDiv.textContent = 'Нажмите кнопку для воспроизведения';
                            });
                    }
                } catch (error) {
                    console.error('Ошибка воспроизведения аудио:', error);
                    showTeacherSpeech(data.text);
                }
            });
            
            socket.on('speech_text', (data) => {
                if (data.is_teacher) {
                    showTeacherSpeech(data.text);
                } else {
                    showStudentSpeech(data.text, data.sid);
                }
            });
            
            socket.on('participants_update', (data) => {
                participantsCount.textContent = data.count;
            });
            
            socket.on('speech_history', (data) => {
                speechHistory = data.history;
            });
            
            socket.on('ai_teacher_available', () => {
                activateAiBtn.style.display = 'block';
            });
            
            socket.on('ai_teacher_activated', () => {
                aiTeacherActivated = true;
                activateAiBtn.style.display = 'none';
                statusDiv.textContent = 'AI-Teacher активирован';
            });
            
            socket.on('speaking_state', (data) => {
                if (data.speaking) {
                    statusDiv.textContent = 'AI-Teacher говорит...';
                } else {
                    statusDiv.textContent = 'AI-Teacher готов';
                }
            });
            
            socket.on('lesson_started', (data) => {
                currentLesson = data;
                currentParagraph = 0;
                lessonTitle.textContent = `${data.subject}: ${data.title}`;
                loadLessonContent(data.lesson_id);
            });
        }

        async function enableCameraAndMicrophone() {
            try {
                // Запрашиваем доступ к камере и микрофону одновременно
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    }
                });
                
                userStream = stream;
                
                // Включаем камеру
                selfVideo.srcObject = userStream;
                isCamOn = true;
                camBtn.classList.add('active');
                camBtn.querySelector('span').textContent = 'Выкл';
                document.getElementById('self-video-container').style.display = 'block';
                
                // Включаем микрофон
                isMicOn = true;
                micBtn.classList.add('active');
                micBtn.querySelector('span').textContent = 'Выкл';
                
                if (recognition && !isIOS) {
                    recognition.start();
                }
                
                statusDiv.textContent = 'Камера и микрофон включены';
                cameraPermission.style.display = 'none';
                
            } catch (error) {
                console.error('Ошибка доступа к камере/микрофону:', error);
                cameraPermission.style.display = 'block';
                
                if (error.name === 'NotAllowedError') {
                    statusDiv.textContent = 'Доступ к камере/микрофону запрещен';
                } else {
                    statusDiv.textContent = 'Ошибка доступа к устройствам';
                }
            }
        }

        function loadLessonContent(lessonId) {
            fetch(`/api/lesson_content/${lessonId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.content && data.content.length > 0) {
                        currentLessonContent = data.content;
                        displayLessonParagraph(0);
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки урока:', error);
                });
        }

        function displayLessonParagraph(paragraphIndex) {
            if (paragraphIndex < currentLessonContent.length) {
                const paragraph = currentLessonContent[paragraphIndex];
                
                // Анимация исчезновения предыдущего текста
                if (lessonText.textContent !== '') {
                    lessonText.classList.add('slide-out');
                    setTimeout(() => {
                        lessonText.classList.remove('slide-out');
                        lessonText.textContent = '';
                        animateTextTyping(paragraph);
                    }, 500);
                } else {
                    animateTextTyping(paragraph);
                }
                
                currentParagraph = paragraphIndex + 1;
            } else {
                // Урок завершен
                lessonContent.style.display = 'none';
                currentLesson = null;
            }
        }

        function animateTextTyping(text) {
            lessonContent.style.display = 'block';
            
            if (currentTypingAnimation) {
                currentTypingAnimation.pause();
            }
            
            lessonText.textContent = '';
            const cursor = document.createElement('span');
            cursor.className = 'typing-cursor';
            lessonText.appendChild(cursor);
            
            let currentIndex = 0;
            const typingSpeed = 30; // ms per character
            
            currentTypingAnimation = setInterval(() => {
                if (currentIndex < text.length) {
                    const char = text.charAt(currentIndex);
                    const textNode = document.createTextNode(char);
                    lessonText.insertBefore(textNode, cursor);
                    currentIndex++;
                    
                    // Прокрутка к последнему символу
                    lessonText.scrollTop = lessonText.scrollHeight;
                } else {
                    clearInterval(currentTypingAnimation);
                    lessonText.removeChild(cursor);
                }
            }, typingSpeed);
        }

        function showTeacherSpeech(text) {
            teacherSpeech.textContent = text;
            teacherSpeech.style.display = 'block';
            
            anime({
                targets: teacherSpeech,
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 500,
                easing: 'easeOutQuad'
            });
            
            setTimeout(() => {
                anime({
                    targets: teacherSpeech,
                    opacity: [1, 0],
                    translateY: [0, -20],
                    duration: 500,
                    easing: 'easeInQuad',
                    complete: () => {
                        teacherSpeech.style.display = 'none';
                    }
                });
            }, 5000);
        }

        function showStudentSpeech(text, sid) {
            studentSpeech.textContent = text;
            studentSpeech.style.display = 'block';
            
            anime({
                targets: studentSpeech,
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 500,
                easing: 'easeOutQuad'
            });
            
            setTimeout(() => {
                anime({
                    targets: studentSpeech,
                    opacity: [1, 0],
                    translateY: [0, -20],
                    duration: 500,
                    easing: 'easeInQuad',
                    complete: () => {
                        studentSpeech.style.display = 'none';
                    }
                });
            }, 5000);
        }

        audioPlayBtn.addEventListener('click', () => {
            if (pendingAudio) {
                pendingAudio.play()
                    .then(() => {
                        audioOverlay.style.display = 'none';
                        pendingAudio = null;
                    })
                    .catch(error => {
                        console.error('Ошибка воспроизведения:', error);
                        statusDiv.textContent = 'Ошибка воспроизведения';
                    });
            }
        });

        activateAiBtn.addEventListener('click', () => {
            socket.emit('activate_ai_teacher', { room_id: roomId });
        });

        manualSpeechBtn.addEventListener('click', () => {
            manualSpeechInput.style.display = 'flex';
            manualSpeechBtn.style.display = 'none';
            speechInputText.focus();
        });

        sendSpeechBtn.addEventListener('click', () => {
            const text = speechInputText.value.trim();
            if (text) {
                socket.emit('recognized_speech', {
                    room_id: roomId,
                    text: text
                });
                showStudentSpeech(text, 'me');
                speechInputText.value = '';
                manualSpeechInput.style.display = 'none';
                manualSpeechBtn.style.display = 'block';
            }
        });

        speechInputText.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendSpeechBtn.click();
            }
        });

        async function toggleMicrophone() {
            try {
                if (!isMicOn) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            sampleRate: 44100
                        }
                    });
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = audioStream;
                    }
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Микрофон включен';
                    
                    if (recognition && !isIOS) {
                        recognition.start();
                    }
                } else {
                    if (userStream) {
                        userStream.getAudioTracks().forEach(track => track.stop());
                    }
                    isMicOn = false;
                    micBtn.classList.remove('active');
                    micBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Микрофон выключен';
                    
                    if (recognition && !isIOS) {
                        recognition.stop();
                    }
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к микрофону';
                console.error('Ошибка доступа к микрофону:', error);
            }
        }

        async function toggleCamera() {
            try {
                if (!isCamOn) {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: 'user'
                        }
                    });
                    
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => userStream.addTrack(track));
                    } else {
                        userStream = videoStream;
                    }
                    
                    selfVideo.srcObject = userStream;
                    isCamOn = true;
                    camBtn.classList.add('active');
                    camBtn.querySelector('span').textContent = 'Выкл';
                    statusDiv.textContent = 'Камера включена';
                    document.getElementById('self-video-container').style.display = 'block';
                    cameraPermission.style.display = 'none';
                } else {
                    if (userStream) {
                        userStream.getVideoTracks().forEach(track => track.stop());
                        selfVideo.srcObject = null;
                    }
                    isCamOn = false;
                    camBtn.classList.remove('active');
                    camBtn.querySelector('span').textContent = 'Вкл';
                    statusDiv.textContent = 'Камера выключена';
                    document.getElementById('self-video-container').style.display = 'none';
                }
            } catch (error) {
                statusDiv.textContent = 'Ошибка доступа к камере';
                console.error('Ошибка доступа к камере:', error);
                
                if (error.name === 'NotAllowedError') {
                    cameraPermission.style.display = 'block';
                }
            }
        }

        enableCameraBtn.addEventListener('click', async () => {
            await enableCameraAndMicrophone();
        });

        function toggleFullscreen() {
            if (!isFullscreen) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
                isFullscreen = true;
                fullscreenBtn.querySelector('span').textContent = 'Обычный';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
                fullscreenBtn.querySelector('span').textContent = 'Полный';
            }
        }

        function endCall() {
            if (userStream) {
                userStream.getTracks().forEach(track => track.stop());
            }
            if (recognition) {
                recognition.stop();
            }
            if (socket) {
                socket.emit('leave_room', { room_id: roomId });
                socket.disconnect();
            }
            
            if (isEmbedded) {
                window.parent.postMessage('conference_ended', '*');
            } else {
                window.location.href = '/';
            }
        }

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window && !isIOS) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ru-RU';

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        socket.emit('recognized_speech', {
                            room_id: roomId,
                            text: finalTranscript
                        });
                        showStudentSpeech(finalTranscript, 'me');
                    }
                };

                recognition.onerror = (event) => {
                    console.error('Ошибка распознавания речи:', event.error);
                };
            } else {
                console.warn('Распознавание речи не поддерживается или отключено для iOS');
                manualSpeechBtn.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            createBackgroundAnimation();
            initSpeechRecognition();
            
            micBtn.addEventListener('click', toggleMicrophone);
            camBtn.addEventListener('click', toggleCamera);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            endCallBtn.addEventListener('click', endCall);

            if (isEmbedded) {
                document.body.classList.add('embedded');
            }

            window.addEventListener('message', (event) => {
                if (event.data === 'end_conference') {
                    endCall();
                }
            });
            
            window.addEventListener('resize', () => {
                animationCircles.forEach(circle => circle.remove());
                animationCircles = [];
                createBackgroundAnimation();
            });
            
            // Обработчик для получения следующих абзацев урока
            socket.on('speech_text', (data) => {
                if (data.is_teacher && currentLesson && data.text.startsWith('Учитель:')) {
                    const lessonText = data.text.replace('Учитель: ', '');
                    const paragraphIndex = currentLessonContent.indexOf(lessonText);
                    if (paragraphIndex !== -1 && paragraphIndex >= currentParagraph) {
                        displayLessonParagraph(paragraphIndex);
                    }
                }
            });
        });

        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'Обычный' : 'Полный';
        });
    </script>
</body>
</html>
