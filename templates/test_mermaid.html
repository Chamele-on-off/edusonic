<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Prompt Tester</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        
        .input-section, .output-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .section-title {
            font-size: 1.5em;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        .prompt-input {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-size: 16px;
            font-family: monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        .prompt-input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .preset-btn {
            padding: 12px 15px;
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .preset-btn:hover {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        .generate-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .generate-btn:hover {
            background: #219a52;
        }
        
        .generate-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .result-container {
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
            background: #f8f9fa;
        }
        
        .mermaid-diagram {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .code-output {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #3498db;
        }
        
        .error {
            color: #e74c3c;
            padding: 15px;
            background: #fadbd8;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .success {
            color: #27ae60;
            padding: 15px;
            background: #d5f4e6;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .rating-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .rating-btn {
            padding: 8px 15px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .rating-btn:hover {
            transform: translateY(-2px);
        }
        
        .rating-good {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }
        
        .rating-average {
            background: #f39c12;
            color: white;
            border-color: #f39c12;
        }
        
        .rating-poor {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }
        
        .history-item {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .history-item:hover {
            background: #d5dbdb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 Mermaid Prompt Tester</h1>
            <p>Найдите идеальный промт для создания образовательных диаграмм</p>
        </div>
        
        <div class="content">
            <div class="input-section">
                <h2 class="section-title">Промт для LLM</h2>
                
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="loadPreset('structure')">Структурная схема</button>
                    <button class="preset-btn" onclick="loadPreset('process')">Процесс/Алгоритм</button>
                    <button class="preset-btn" onclick="loadPreset('hierarchy')">Иерархия</button>
                    <button class="preset-btn" onclick="loadPreset('timeline')">Временная линия</button>
                    <button class="preset-btn" onclick="loadPreset('comparison')">Сравнение</button>
                    <button class="preset-btn" onclick="loadPreset('relationship')">Взаимосвязи</button>
                </div>
                
                <textarea class="prompt-input" id="promptInput" placeholder="Опишите, какую диаграмму вы хотите создать..."></textarea>
                
                <div class="input-options">
                    <label>
                        <input type="checkbox" id="addExamples" checked>
                        Добавить примеры в промт
                    </label>
                    <label>
                        <input type="checkbox" id="addConstraints" checked>
                        Добавить ограничения синтаксиса
                    </label>
                </div>
                
                <button class="generate-btn" onclick="generateDiagram()" id="generateBtn">
                    🚀 Сгенерировать диаграмму
                </button>
                
                <div class="loading" id="loading">
                    <p>⏳ Генерируем диаграмму через LLM...</p>
                </div>
            </div>
            
            <div class="output-section">
                <h2 class="section-title">Результат</h2>
                
                <div class="result-container">
                    <div id="diagramOutput" class="mermaid-diagram">
                        <p>Диаграмма появится здесь после генерации</p>
                    </div>
                    
                    <div id="codeOutput" class="code-output">
                        // Код Mermaid появится здесь
                    </div>
                    
                    <div class="rating-buttons">
                        <button class="rating-btn rating-good" onclick="rateDiagram('good')">👍 Хорошо</button>
                        <button class="rating-btn rating-average" onclick="rateDiagram('average')">👌 Нормально</button>
                        <button class="rating-btn rating-poor" onclick="rateDiagram('poor')">👎 Плохо</button>
                    </div>
                </div>
                
                <div id="messageArea"></div>
                
                <div class="history-section">
                    <h3 class="section-title">История промтов</h3>
                    <div id="historyList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose',
            flowchart: {
                useMaxWidth: true,
                htmlLabels: true
            }
        });

        let history = JSON.parse(localStorage.getItem('mermaidHistory') || '[]');
        let currentPrompt = '';

        // Пресеты промтов
        const presets = {
            structure: `Создай структурную диаграмму для темы "Строение клетки".

Требования:
- Покажи основные компоненты клетки и их взаимосвязи
- Используй прямоугольники для органелл
- Покажи связи между компонентами
- Максимум 8-10 элементов
- Русские подписи

Верни ТОЛЬКО код Mermaid без пояснений.`,

            process: `Создай диаграмму процесса для "Фотосинтез у растений".

Требования:
- Покажи последовательные этапы процесса
- Используй стрелки для направления
- Включи входные и выходные элементы
- Сделай понятную последовательность
- Русские подписи

Верни ТОЛЬКО код Mermaid без пояснений.`,

            hierarchy: `Создай иерархическую диаграмму для "Классификация живых организмов".

Требования:
- Покажи древовидную структуру
- Используй разные уровни вложенности
- Сделай логическую классификацию
- Русские подписи

Верни ТОЛЬКО код Mermaid без пояснений.`,

            timeline: `Создай временную диаграмму для "Этапы Великой Отечественной войны".

Требования:
- Расположи события в хронологическом порядке
- Укажи даты и основные события
- Покажи причинно-следственные связи
- Русские подписи

Верни ТОЛЬКО код Mermaid без пояснений.`,

            comparison: `Создай сравнительную диаграмму для "Сравнение митоза и мейоза".

Требования:
- Покажи сходства и различия
- Используй параллельные колонки
- Выдели ключевые отличия
- Русские подписи

Верни ТОЛЬКО код Mermaid без пояснений.`,

            relationship: `Создай диаграмму взаимосвязей для "Круговорот воды в природе".

Требования:
- Покажи циклические процессы
- Обозначи основные компоненты системы
- Покажи направление потоков
- Русские подписи

Верни ТОЛЬКО код Mermaid без пояснений.`
        };

        function loadPreset(presetKey) {
            document.getElementById('promptInput').value = presets[presetKey];
            showMessage('Пресет загружен! Можете изменить промт под свои нужды.', 'success');
        }

        async function generateDiagram() {
            const promptInput = document.getElementById('promptInput');
            const generateBtn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const diagramOutput = document.getElementById('diagramOutput');
            const codeOutput = document.getElementById('codeOutput');
            const messageArea = document.getElementById('messageArea');

            currentPrompt = promptInput.value.trim();
            
            if (!currentPrompt) {
                showMessage('Введите промт для генерации диаграммы', 'error');
                return;
            }

            // Показываем загрузку
            generateBtn.disabled = true;
            loading.style.display = 'block';
            diagramOutput.innerHTML = '<p>⏳ Генерируем диаграмму...</p>';
            messageArea.innerHTML = '';

            try {
                // Отправляем запрос к вашему бэкенду
                const response = await fetch('/api/test-mermaid', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: currentPrompt,
                        addExamples: document.getElementById('addExamples').checked,
                        addConstraints: document.getElementById('addConstraints').checked
                    })
                });

                const data = await response.json();

                if (data.success && data.mermaid_code) {
                    // Сохраняем в историю
                    saveToHistory(currentPrompt, data.mermaid_code);
                    
                    // Показываем код
                    codeOutput.textContent = data.mermaid_code;
                    
                    // Рендерим диаграмму
                    diagramOutput.innerHTML = '<div class="mermaid">' + data.mermaid_code + '</div>';
                    
                    // Инициализируем Mermaid для новой диаграммы
                    mermaid.init(undefined, document.querySelectorAll('.mermaid'));
                    
                    showMessage('Диаграмма успешно сгенерирована!', 'success');
                } else {
                    throw new Error(data.error || 'Неизвестная ошибка');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Ошибка генерации: ' + error.message, 'error');
                diagramOutput.innerHTML = '<p>❌ Ошибка генерации диаграммы</p>';
            } finally {
                generateBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function saveToHistory(prompt, code) {
            const historyItem = {
                prompt: prompt,
                code: code,
                timestamp: new Date().toISOString(),
                rating: null
            };
            
            history.unshift(historyItem);
            if (history.length > 10) history.pop();
            
            localStorage.setItem('mermaidHistory', JSON.stringify(history));
            renderHistory();
        }

        function rateDiagram(rating) {
            if (history.length > 0) {
                history[0].rating = rating;
                localStorage.setItem('mermaidHistory', JSON.stringify(history));
                showMessage(`Оценка "${getRatingText(rating)}" сохранена!`, 'success');
            }
        }

        function getRatingText(rating) {
            const ratings = {
                'good': 'Хорошо',
                'average': 'Нормально', 
                'poor': 'Плохо'
            };
            return ratings[rating] || rating;
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            history.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <strong>${item.prompt.substring(0, 80)}${item.prompt.length > 80 ? '...' : ''}</strong>
                    <div style="font-size: 0.8em; color: #666; margin-top: 5px;">
                        ${new Date(item.timestamp).toLocaleString()}
                        ${item.rating ? ` • Оценка: ${getRatingText(item.rating)}` : ''}
                    </div>
                `;
                
                historyItem.onclick = () => {
                    document.getElementById('promptInput').value = item.prompt;
                    document.getElementById('codeOutput').textContent = item.code;
                    document.getElementById('diagramOutput').innerHTML = '<div class="mermaid">' + item.code + '</div>';
                    mermaid.init(undefined, document.querySelectorAll('.mermaid'));
                    showMessage('Промт загружен из истории', 'success');
                };
                
                historyList.appendChild(historyItem);
            });
        }

        function showMessage(message, type) {
            const messageArea = document.getElementById('messageArea');
            messageArea.innerHTML = `<div class="${type}">${message}</div>`;
            
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            renderHistory();
            
            // Загружаем первый пресет по умолчанию
            loadPreset('structure');
        });
    </script>
</body>
</html>
