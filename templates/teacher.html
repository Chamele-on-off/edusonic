<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимация аватара</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        #avatar-container {
            width: 400px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid #ddd;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #avatar-image {
            max-width: 100%;
            max-height: 100%;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        button {
            padding: 10px 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #status {
            text-align: center;
            margin: 10px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Анимация цифрового аватара</h1>
    
    <div id="avatar-container">
        <img id="avatar-image" src="" alt="Аватар">
    </div>
    
    <div id="status">Загрузка...</div>
    
    <div class="controls">
        <button id="start-btn">Старт</button>
        <button id="stop-btn" disabled>Стоп</button>
        <button id="blink-btn">Моргнуть</button>
    </div>

    <script>
        // Конфигурация
        const FPS = 10;
        let animationFrames = {};
        let currentAnimation = 'mouth_neutral';
        let currentFrame = 0;
        let animationInterval = null;
        
        // Элементы
        const avatarImage = document.getElementById('avatar-image');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const blinkBtn = document.getElementById('blink-btn');
        
        // Загрузка кадров
        async function loadFrames() {
            try {
                const response = await fetch('/api/avatar_frames');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                animationFrames = data;
                statusDiv.textContent = `Загружено: ${Object.keys(data).length} групп анимации`;
                
                // Начинаем с нейтрального состояния
                if (animationFrames.mouth_neutral.length > 0) {
                    avatarImage.src = animationFrames.mouth_neutral[0];
                    startBtn.disabled = false;
                }
                
            } catch (error) {
                statusDiv.textContent = `Ошибка: ${error.message}`;
                console.error('Ошибка загрузки кадров:', error);
            }
        }
        
        // Обновление кадра
        function updateFrame() {
            const frames = animationFrames[currentAnimation];
            if (!frames || frames.length === 0) return;
            
            currentFrame = (currentFrame + 1) % frames.length;
            avatarImage.src = frames[currentFrame];
            statusDiv.textContent = `${currentAnimation} (${currentFrame + 1}/${frames.length})`;
        }
        
        // Запуск анимации
        function startAnimation() {
            if (animationInterval) return;
            
            animationInterval = setInterval(updateFrame, 1000 / FPS);
            startBtn.disabled = true;
            stopBtn.disabled = false;
        }
        
        // Остановка анимации
        function stopAnimation() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
                currentFrame = 0;
                avatarImage.src = animationFrames[currentAnimation][0];
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }
        
        // Моргание
        function doBlink() {
            if (!animationFrames.blink || animationFrames.blink.length === 0) return;
            
            const originalAnimation = currentAnimation;
            currentAnimation = 'blink';
            currentFrame = 0;
            avatarImage.src = animationFrames.blink[0];
            
            setTimeout(() => {
                currentAnimation = originalAnimation;
                currentFrame = 0;
                avatarImage.src = animationFrames[currentAnimation][0];
            }, 300);
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadFrames();
            
            startBtn.addEventListener('click', startAnimation);
            stopBtn.addEventListener('click', stopAnimation);
            blinkBtn.addEventListener('click', doBlink);
        });
    </script>
</body>
</html>
